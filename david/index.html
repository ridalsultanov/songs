<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Песенник Давида</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=lad">
<link rel="icon" href="icons/icon-192.png?v=lad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Песенник Д.">
<style>
/* Layout: iOS-приложение — большой заголовок, поиск, список с алфавитом, стеклянный таб-бар; песня выезжает справа, внизу плавающая панель как у плеера.
   Палитра: системные нейтрали iOS + янтарь гитарной струны как единственный акцент */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --fg:#000000; --fg2:rgba(60,60,67,.62); --fg3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.22); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --accent:#D97800; --accent-ink:#FFFFFF; --chord:#C76E00; --glass:rgba(248,248,250,.8); --glass-line:rgba(0,0,0,.08);
  --danger:#FF3B30; --star:#F5B800; --shadow:0 12px 40px rgba(0,0,0,.18);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --fg:#FFFFFF; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#FF9F0A; --accent-ink:#1B1000; --chord:#FFB340; --glass:rgba(28,28,30,.72); --glass-line:rgba(255,255,255,.08);
  --danger:#FF453A; --star:#FFD60A; --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --fg:#FFFFFF; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#FF9F0A; --accent-ink:#1B1000; --chord:#FFB340; --glass:rgba(28,28,30,.72); --glass-line:rgba(255,255,255,.08);
  --danger:#FF453A; --star:#FFD60A; --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- навбар со сжимающимся заголовком ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:background .2s,box-shadow .2s}
.nav.scrolled{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.nav .mid{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap}
.nav.scrolled .mid{opacity:1}
.nav .right{justify-self:end;display:flex;gap:4px}
.nav .left{justify-self:start}
.nbtn{height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-size:17px;border-radius:18px;padding:0 6px}
.nbtn svg.i{width:26px;height:26px}
.large{padding-block:2px 8px}
.large h1{font-size:34px;font-weight:700;letter-spacing:.01em;margin:0;line-height:1.15}
.large p{margin:2px 0 0;color:var(--fg2);font-size:15px}
.search{position:relative;margin-block:6px 10px}
.search input{width:100%;height:36px;border:0;border-radius:10px;background:var(--fill);padding:0 32px 0 34px;font-size:17px;outline:none}
.search input::placeholder{color:var(--fg2)}
.search svg{position:absolute;left:9px;top:9px;width:18px;height:18px;stroke:var(--fg2)}
.search .clr{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:12px;color:var(--fg2);font-size:15px}
.actions{display:flex;gap:10px;margin-block:4px 14px}
.pill{height:44px;border-radius:12px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fill);color:var(--accent)}
.pill.primary{background:var(--accent);color:var(--accent-ink);flex:1}

/* ---------- список ---------- */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.section-h{position:sticky;top:calc(44px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.04em;text-transform:uppercase;padding:14px 0 6px}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{position:relative;overflow:hidden}
.cell .act{position:absolute;inset:0 0 0 auto;width:96px;display:flex;align-items:center;justify-content:center;background:var(--star);color:#1A1400;font-weight:600;font-size:14px;flex-direction:column;gap:2px}
.cell .act.rm{background:var(--fill2);color:var(--fg)}
.cell .fg{position:relative;background:var(--cell);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 14px 8px 12px;width:100%;text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.cell + .cell .fg::before{content:"";position:absolute;top:0;left:68px;right:0;height:.5px;background:var(--sep)}
.art{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.25);flex:none}
.art{position:relative;overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.cell .txt{min-width:0}
.cell .t{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .a{font-size:14px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.cell .meta{display:flex;align-items:center;gap:6px;color:var(--fg3)}
.cell .meta .st{color:var(--star);font-size:13px}
.cell .meta .nt{color:var(--chord);font-size:13px}
.cell .meta svg{width:14px;height:14px;stroke:var(--fg3);stroke-width:2.5}
.num{width:24px;text-align:center;color:var(--fg2);font-variant-numeric:tabular-nums;font-size:15px}
.reo{display:flex;gap:2px}
.reo button{width:34px;height:34px;border-radius:17px;background:var(--fill);color:var(--fg);font-size:12px}
.reo button:disabled{opacity:.3}
.empty{color:var(--fg2);text-align:center;padding:60px 24px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--fg);font-size:20px;margin-bottom:6px}
.index{position:fixed;right:max(2px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;padding:4px 2px;touch-action:none}
.index button{font-size:10.5px;font-weight:600;color:var(--accent);line-height:1.25;width:18px}

/* ---------- таб-бар ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(3,1fr);max-width:560px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--fg3);font-size:10.5px;font-weight:500}
.tab svg.i{width:26px;height:26px;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .badge{position:absolute;margin-left:22px;margin-top:-2px;background:var(--danger);color:#fff;border-radius:9px;font-size:11px;padding:0 5px;min-width:18px;line-height:18px}

/* ---------- экран песни ---------- */
.push{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.85,.25,1);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.push.open{transform:none}
.push.drag{transition:none}
.push .nav{position:relative;top:0}
.back{color:var(--accent);display:inline-flex;align-items:center;gap:2px;font-size:17px;height:44px;padding-right:8px}
.back svg{width:22px;height:22px;stroke-width:2.6}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.hero{position:relative;padding-block:8px 18px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-60% -20% 0;background:radial-gradient(60% 60% at 30% 40%,var(--aura,transparent),transparent 70%);opacity:.45;pointer-events:none;filter:blur(10px)}
.hero::after{content:"";position:absolute;inset:-40px;background:var(--cover,none) center/cover;filter:blur(40px) saturate(1.4);opacity:.5;pointer-events:none;mask-image:linear-gradient(#000 40%,transparent);-webkit-mask-image:linear-gradient(#000 40%,transparent)}
.hero .row{position:relative;z-index:1;display:flex;gap:14px;align-items:center}
.hero .art{width:64px;height:64px;border-radius:14px;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hero h2{margin:0;font-size:26px;font-weight:700;line-height:1.15;text-wrap:balance}
.hero p{margin:3px 0 0;color:var(--fg2);font-size:16px}
.capo-note{margin:0 0 12px;font-size:14px;color:var(--fg2);background:var(--fill);border-radius:10px;padding:8px 12px}
.capo-note b{color:var(--chord)}
pre.chords{margin:0;font-family:var(--f-mono);font-size:var(--fs,16px);line-height:1.6;white-space:pre-wrap;word-break:break-word;letter-spacing:0}
pre.chords .c{color:var(--chord);font-weight:700;cursor:pointer;border-radius:5px;padding:0 1px}
pre.chords .c:active{background:var(--fill2)}
.emptycard{background:var(--cell);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.emptycard p{margin:0;color:var(--fg2);font-size:15px;line-height:1.45}
.emptycard .pill{flex:none}
.emptycard code{font-family:var(--f-mono);color:var(--chord);font-size:14px}
.sites{display:flex;flex-direction:column;background:var(--cell);border-radius:12px;overflow:hidden}
.sites a{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;color:var(--accent);text-decoration:none}
.sites a + a{box-shadow:inset 0 .5px 0 var(--sep)}
.sites a span{color:var(--fg3)}
.nextcard{display:flex;align-items:center;gap:12px;width:100%;margin-top:28px;background:var(--cell);border-radius:14px;padding:12px 14px;text-align:left}
.nextcard .lbl{font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.nextcard .t{font-weight:600}
.nextcard svg{margin-left:auto;stroke:var(--fg3)}
.pad-bottom{height:calc(150px + env(safe-area-inset-bottom,0px))}

/* плавающая панель */
.player{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:22px;border:.5px solid var(--glass-line);box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
.prow{display:flex;align-items:center;gap:6px;justify-content:space-between}
.step{display:flex;align-items:center;background:var(--fill);border-radius:14px;height:44px}
.step button{width:36px;height:44px;font-size:20px;color:var(--fg)}
.step output{min-width:44px;text-align:center;display:flex;flex-direction:column;line-height:1.05}
.step output b{font-size:15px;font-variant-numeric:tabular-nums}
.step output small{font-size:10px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.round{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:var(--fill);font-weight:700;font-size:15px}
.round.play{background:var(--accent);color:var(--accent-ink)}
.round.play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.speed{display:flex;align-items:center;gap:10px;padding:0 6px}
.speed input{flex:1;accent-color:var(--accent)}
.speed span{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}

/* ---------- шиты и меню ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:14px 14px 0 0;max-height:94%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet.tall{height:94%}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:6px auto 0}
.shnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px}
.shnav b{font-weight:600}
.shnav .r{justify-self:end;color:var(--accent);font-weight:600}
.shnav .l{justify-self:start;color:var(--accent)}
.shbody{overflow-y:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:18px}
.form{background:var(--cell);border-radius:12px;overflow:hidden}
.form input{display:block;width:100%;height:46px;border:0;background:none;padding:0 16px;font-size:17px;outline:none}
.form input + input{box-shadow:inset 0 .5px 0 var(--sep)}
.ta{width:100%;border:0;border-radius:12px;background:var(--cell);padding:14px 16px;font-family:var(--f-mono);font-size:15px;line-height:1.5;outline:none;resize:none}
.flabel{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px 16px}
.menu{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.menu .grp{border-radius:14px;overflow:hidden}
.menu .grp > *{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;font-size:19px;color:var(--accent);text-decoration:none;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.menu .grp > * + *{box-shadow:inset 0 .5px 0 var(--sep)}
.menu .grp .ttl{height:auto;padding:14px;font-size:13px;color:var(--fg2);flex-direction:column}
.menu .grp .danger{color:var(--danger)}
.menu .grp .chk{color:var(--fg)}
.menu .grp .chk.on::after{content:"✓";color:var(--accent);margin-left:6px;font-weight:700}
.menu .cancel{font-weight:600}
.actsheet{background:transparent;padding-inline:max(8px,env(safe-area-inset-left,0px));}
.note{font-size:13px;color:var(--fg2);line-height:1.45;margin:0 4px}

/* схема аккорда */
.dia{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,10px) scale(.96);opacity:0;pointer-events:none;transition:all .2s;border-radius:20px;border:.5px solid var(--glass-line);box-shadow:var(--shadow);padding:14px 18px 12px;text-align:center;width:200px}
.dia.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.dia b{font-family:var(--f-mono);font-size:20px;color:var(--chord)}
.dia small{display:block;color:var(--fg2);font-size:12px;margin-top:4px}
.dia svg{display:block;margin:8px auto 0;width:140px;height:auto}
.dia svg .ln{stroke:var(--fg3)} .dia svg .nut{stroke:var(--fg)} .dia svg .dt{fill:var(--fg)} .dia svg .tx{fill:var(--fg2);font-family:var(--f-mono);font-size:11px}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;transition:all .25s;z-index:90;border-radius:20px;padding:10px 18px;font-size:15px;font-weight:600;box-shadow:var(--shadow);border:.5px solid var(--glass-line);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.push,.sheet,.scrim,.dia,.toast,.cell .fg{transition:none}}
@media (min-width:700px){main .gut,.large,.searchwrap{max-width:720px;margin-inline:auto}}
</style>
</head>
<body>


<div id="home">
  <div class="nav gut" id="nav">
    <div class="left"><button class="nbtn" id="editSet" hidden>Править</button></div>
    <div class="mid" id="navTitle">Песни</div>
    <div class="right">
      <button class="nbtn" id="addBtn" aria-label="Добавить песню"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="nbtn" id="moreBtn" aria-label="Ещё"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="3"/></svg></button>
    </div>
  </div>
  <main>
    <div class="gut">
      <div class="large"><h1 id="bigTitle">Песни</h1><p id="count"></p></div>
      <div class="search" id="searchWrap"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Песня, исполнитель или строчка" autocomplete="off" aria-label="Поиск"><button class="clr" id="qClr" hidden aria-label="Очистить">✕</button></div>
      <div class="actions" id="eveActions" hidden><button class="pill primary" id="startEve"><svg class="i" viewBox="0 0 24 24" style="fill:currentColor;stroke:none;width:18px;height:18px"><path d="M7 4.5v15l13-7.5z"/></svg>Начать вечер</button></div>
      <div id="list"></div>
    </div>
  </main>
  <div class="index" id="index" hidden></div>
</div>

<nav class="tabbar glass" aria-label="Разделы"><div class="in">
  <button class="tab" data-tab="all" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Песни</button>
  <button class="tab" data-tab="eve" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Вечер</button>
  <button class="tab" data-tab="mine" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Мои</button>
</div></nav>

<section class="push" id="song" aria-label="Песня">
  <div class="nav gut" id="sNav">
    <div class="left"><button class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="backLbl">Песни</span></button></div>
    <div class="mid" id="sNavTitle"></div>
    <div class="right">
      <button class="nbtn" id="sStar" aria-label="В вечер"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
      <button class="nbtn" id="sMore" aria-label="Действия"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="3"/></svg></button>
    </div>
  </div>
  <div class="scroller" id="sBody">
    <div class="hero gut" id="hero"><div class="row"><div class="art" id="sArt"></div><div style="min-width:0"><h2 id="sTitle"></h2><p id="sArtist"></p></div></div></div>
    <div class="gut">
      <div class="capo-note" id="capoNote" hidden></div>
      <div id="view"></div>
      <div id="nextWrap"></div>
      <div class="pad-bottom"></div>
    </div>
  </div>
  <div class="player glass" id="player">

const TITLES={all:'Песни',eve:'Вечер',mine:'Мои'};

function filtered(){const q=norm($('q').value.trim());
  let items=ALL.filter(s=>tab==='eve'?!!st.fav[idOf(s)]:tab==='mine'?(has(s)||s.custom):true);
  if(q)items=items.filter(s=>norm(s.s+' '+s.a+' '+(st.chords[idOf(s)]||'')).includes(q));
  const col=(x,y)=>x.localeCompare(y,'ru',{sensitivity:'base'});
  if(tab==='eve')items.sort((x,y)=>st.order.indexOf(idOf(x))-st.order.indexOf(idOf(y)));
  else if(sort==='song')items.sort((x,y)=>col(x.s,y.s)||col(x.a,y.a));
  else if(sort==='artist')items.sort((x,y)=>col(x.a,y.a)||col(x.s,y.s));
  else items.sort((x,y)=>x.id-y.id);
  return items}
function letterOf(s){const k=(sort==='artist'?s.a:s.s).replace(/^Misc\s+\w+/,'').trim();
  let c=(k[0]||'#').toUpperCase().replace('Ё','Е');c=c.normalize('NFD')[0];
  return /[А-Я]/.test(c)?c:/[A-Z]/.test(c)?c:'#'}
const LORDER=l=>/[А-Я]/.test(l)?0:/[A-Z]/.test(l)?1:2;
function renderHome(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  $('bigTitle').textContent=$('navTitle').textContent=TITLES[tab];
  $('addBtn').hidden=tab==='eve';$('moreBtn').hidden=tab==='eve';
  $('editSet').hidden=tab!=='eve'||!ALL.some(s=>st.fav[idOf(s)]);$('editSet').textContent=editSet?'Готово':'Править';
  const items=filtered();lastItems=items;
  const total=tab==='all'?ALL.length:items.length;
  $('count').textContent=$('q').value.trim()?items.length+' из '+pl(total):pl(items.length);
  $('eveActions').hidden=tab!=='eve'||!items.length||editSet;
  const L=$('list');L.innerHTML='';
  if(!items.length){const msg=$('q').value.trim()?['Ничего не нашлось','Попробуй другое слово.']:
      tab==='eve'?['Сетлист пуст','Смахни песню влево в списке или нажми ☆ внутри песни, и она появится здесь.']:
      tab==='mine'?['Пока пусто','Здесь будут песни, к которым ты добавил свои аккорды, и песни, добавленные кнопкой ＋.']:['Песен пока нет','Нажми ＋ вверху и добавь первую.'];
    L.innerHTML='<div class="empty"><b>'+msg[0]+'</b>'+msg[1]+'</div>';$('index').hidden=true;return}
  const grouped=tab!=='eve'&&sort!=='added'&&!$('q').value.trim();
  let grp=null;const letters=[];
  const frag=document.createDocumentFragment();
  const newGroup=()=>{grp=document.createElement('div');grp.className='group';frag.append(grp)};
  if(!grouped){const sp=document.createElement('div');sp.style.height='4px';frag.append(sp);newGroup()}
  if(grouped){const buckets=new Map();items.forEach(s=>{const l=letterOf(s);if(!buckets.has(l))buckets.set(l,[]);buckets.get(l).push(s)});
    const keys=[...buckets.keys()].sort((a,b)=>LORDER(a)-LORDER(b)||a.localeCompare(b,'ru'));
    const flat=[];keys.forEach(l=>{letters.push(l);const h=document.createElement('div');h.className='section-h';h.id='sec-'+l;h.textContent=l;frag.append(h);newGroup();
      buckets.get(l).forEach(s=>{flat.push(s);grp.append(cellFor(s,flat.length-1,items.length))})});
    lastItems=flat}
  else items.forEach((s,i)=>grp.append(cellFor(s,i,items.length)));
  L.append(frag);
  const ix=$('index');ix.hidden=!grouped||letters.length<6;ix.innerHTML='';
  letters.forEach(l=>{const b=document.createElement('button');b.textContent=l;b.dataset.l=l;ix.append(b)});
}
function cellFor(s,i,n){const k=idOf(s),fav=!!st.fav[k];
  const c=document.createElement('div');c.className='cell';
  const act=document.createElement('button');act.className='act'+(fav?' rm':'');act.innerHTML=fav?'<span>☆</span>Убрать':'<span>★</span>В вечер';act.tabIndex=-1;
  const fg=document.createElement('button');fg.className='fg';
  const lead=tab==='eve'?'<span class="num">'+(i+1)+'</span>':artHTML(s,120);
  const meta=tab==='eve'&&editSet?'<span class="reo"><button data-d="-1" aria-label="Выше"'+(i===0?' disabled':'')+'>▲</button><button data-d="1" aria-label="Ниже"'+(i===n-1?' disabled':'')+'>▼</button></span>':
    '<span class="meta">'+(fav&&tab!=='eve'?'<span class="st">★</span>':'')+(has(s)?'<span class="nt">♪</span>':'')+'<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>';
  fg.innerHTML=lead+'<span class="txt"><div class="t"></div><div class="a"></div></span>'+meta;
  fg.querySelector('.t').textContent=s.s;fg.querySelector('.a').textContent=s.a+(s.custom?' · добавлена':'');
  c.append(act,fg);
  fg.onclick=e=>{const r=e.target.closest('.reo button');if(r){e.stopPropagation();moveInSet(k,+r.dataset.d);return}
    if(c.classList.contains('opened')){closeSwipe(c);return}openSong(s)};
  act.onclick=()=>{toggleFav(k);toast(st.fav[k]?'Добавлено в вечер':'Убрано из вечера');renderHome()};
  attachSwipe(c,fg);return c}
function moveInSet(k,d){const i=st.order.indexOf(k),j=i+d;if(i<0||j<0||j>=st.order.length)return;[st.order[i],st.order[j]]=[st.order[j],st.order[i]];save();renderHome()}

/* свайп строки влево */
let openedCell=null;
function closeSwipe(c){c.classList.remove('opened');c.querySelector('.fg').style.transform=''}
function attachSwipe(c,fg){let x0=0,y0=0,dx=0,dir=0;
  fg.addEventListener('touchstart',e=>{if(editSet)return;const t=e.touches[0];x0=t.clientX;y0=t.clientY;dx=0;dir=0;if(openedCell&&openedCell!==c){closeSwipe(openedCell);openedCell=null}},{passive:true});
  fg.addEventListener('touchmove',e=>{if(editSet)return;const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
    if(!dir)dir=Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)?1:(Math.abs(my)>8?2:0);
    if(dir===1){const base=c.classList.contains('opened')?-96:0;dx=Math.min(0,Math.max(-130,base+mx));fg.style.transition='none';fg.style.transform='translateX('+dx+'px)'}},{passive:true});
  fg.addEventListener('touchend',()=>{if(dir!==1)return;fg.style.transition='';
    if(dx<-150+60){/* глубокий свайп */}
    if(dx<-110){fg.style.transform='';c.classList.remove('opened');c.querySelector('.act').click();return}
    if(dx<-48){c.classList.add('opened');fg.style.transform='translateX(-96px)';openedCell=c}else closeSwipe(c)})}

let sheetClose=null;
function openSheet(html,{tall=false,action=false,onClose}={}){const sh=$('sheet'),sc=$('scrim');
  sh.className='sheet'+(tall?' tall':'')+(action?' actsheet':'');sh.innerHTML=(action?'':'<div class="grab"></div>')+html;
  sh.hidden=false;sc.hidden=false;requestAnimationFrame(()=>{sh.classList.add('on');sc.classList.add('on')});
  sheetClose=onClose||null;return sh}
function closeSheet(){const sh=$('sheet'),sc=$('scrim');if(sh.hidden)return;sh.classList.remove('on');sc.classList.remove('on');
  setTimeout(()=>{sh.hidden=true;sc.hidden=true;sh.innerHTML=''},300);const f=sheetClose;sheetClose=null;f&&f()}
$('scrim').onclick=closeSheet;
function actionSheet(title,groups){
  const html='<div class="menu">'+groups.map((g,gi)=>'<div class="grp">'+(gi===0&&title?'<div class="ttl">'+title+'</div>':'')+g.map((it,ii)=>
    it.href?'<a href="'+esc(it.href)+'" target="_blank" rel="noopener" data-g="'+gi+'" data-i="'+ii+'">'+esc(it.t)+' ↗</a>':
    '<button class="'+(it.cls||'')+'" data-g="'+gi+'" data-i="'+ii+'">'+esc(it.t)+'</button>').join('')+'</div>').join('')+
    '<div class="grp"><button class="cancel" data-cancel="1">Отмена</button></div></div>';
  const sh=openSheet(html,{action:true});
  sh.onclick=e=>{const b=e.target.closest('[data-g],[data-cancel]');if(!b)return;if(b.dataset.cancel){closeSheet();return}
    const it=groups[b.dataset.g][b.dataset.i];if(it.href){setTimeout(closeSheet,100);return}
    if(it.keep){it.fn&&it.fn();return}closeSheet();setTimeout(()=>it.fn&&it.fn(),it.delay||0)}}

  '<datalist id="artistList">'+[...new Set(ALL.map(s=>s.a))].map(a=>'<option value="'+esc(a)+'">').join('')+'</datalist>',{tall:true});
  setTimeout(()=>$('nA').focus(),350);
  $('aCancel').onclick=closeSheet;
  $('aSave').onclick=()=>{const a=$('nA').value.trim(),s=$('nS').value.trim(),ch=$('nC').value;
    if(!a||!s){toast('Заполни исполнителя и название');return}
    if(ALL.some(x=>norm(x.a)===norm(a)&&norm(x.s)===norm(s))){toast('Такая песня уже есть');return}
    st.custom.push({a,s,t:Date.now()});if(ch.trim())st.chords[a+'|'+s]=ch;save();ALL=allSongs();closeSheet();renderHome();toast('Песня добавлена');
    setTimeout(()=>openSong(ALL.find(x=>x.custom&&x.a===a&&x.s===s)),250)}};

/* резервная копия */
function openBackup(){openSheet('<div class="shnav gut"><span></span><b>Резервная копия</b><button class="r" id="bkDone">Готово</button></div>'+
  '<div class="shbody gut"><p class="note">«Вечер», твои аккорды и добавленные песни хранятся на этом телефоне. Скопируй копию и сохрани в Заметках. На новом телефоне вставь её сюда.</p>'+
  '<button class="pill primary" id="expBtn">Скопировать копию</button><textarea class="ta" id="impText" rows="5" placeholder="Вставь сюда скопированную копию"></textarea>'+
  '<button class="pill" id="impBtn">Восстановить из копии</button></div>');
  $('bkDone').onclick=closeSheet;
  $('expBtn').onclick=()=>{const txt=JSON.stringify({app:'pesennik-david',v:3,data:st});const fb=()=>{$('impText').value=txt;$('impText').select();toast('Выдели текст и скопируй')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('Копия скопирована'),fb)}catch(e){fb()}};
  $('impBtn').onclick=()=>{try{const o=JSON.parse($('impText').value);const d=o.data||o;if(!d.fav&&!d.chords)throw 0;
    st=Object.assign({fav:{},chords:{},tr:{},capo:{},custom:[],order:[],fs:16},d);syncOrder();save();ALL=allSongs();closeSheet();renderHome();toast('Восстановлено')}
    catch(e){toast('Это не похоже на копию песенника')}}}

/* ---------- аккорды: распознавание, транспонирование ---------- */
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B','Fb':'E','E#':'F','B#':'C'};
const CHORD=/^\(?([A-H](?:#|b)?)((?:maj|min|dim|aug|sus|add|m|M|\+|°|ø|\d|\(|\)|b|#)*)(?:\/([A-H](?:#|b)?))?\)?$/;
function noteIdx(n){if(n==='H')return 11;n=FLAT[n]||n;return NOTES.indexOf(n)}
const OUT=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
function shift(n,t){const i=noteIdx(n);if(i<0)return n;let r=OUT[((i+t)%12+12)%12];if(n==='H'&&r==='B')r='H';return r}
function trChord(c,t){if(!CHORD.test(c)||!t)return c;
  return c.replace(/^(\(?)([A-H](?:#|b)?)/,(x,p,n)=>p+shift(n,t)).replace(/\/([A-H](?:#|b)?)/,(x,n)=>'/'+shift(n,t))}
const isChord=w=>CHORD.test(w);
const cspan=c=>'<span class="c" data-c="'+esc(c)+'">'+esc(c)+'</span>';
function render(text,t){
  return text.split('\n').map(line=>{
    if(/\[[A-H][^\]]*\]/.test(line))return esc(line).replace(/\[([A-H][^\]]*)\]/g,(x,c)=>isChord(c)?cspan(trChord(c,t)):'['+c+']');
    const words=line.trim().split(/\s+/).filter(Boolean);
    const chordLine=words.length&&words.every(w=>isChord(w)||/^[|\-–x×\d:.]+$/.test(w));
    if(!chordLine)return esc(line);
    return line.replace(/\S+/g,w=>isChord(w)?cspan(trChord(w,t)):esc(w));
  }).join('\n')}

/* ---------- схемы аккордов ---------- */
// струны E A D G B e; -1 = не играть
const OPEN={'C':[-1,3,2,0,1,0],'C7':[-1,3,2,3,1,0],'Cmaj7':[-1,3,2,0,0,0],'Cadd9':[-1,3,2,0,3,0],
 'D':[-1,-1,0,2,3,2],'Dm':[-1,-1,0,2,3,1],'D7':[-1,-1,0,2,1,2],'Dm7':[-1,-1,0,2,1,1],'Dmaj7':[-1,-1,0,2,2,2],'Dsus2':[-1,-1,0,2,3,0],'Dsus4':[-1,-1,0,2,3,3],
 'E':[0,2,2,1,0,0],'Em':[0,2,2,0,0,0],'E7':[0,2,0,1,0,0],'Em7':[0,2,2,0,3,0],'Esus4':[0,2,2,2,0,0],
 'F':[1,3,3,2,1,1],'Fmaj7':[-1,-1,3,2,1,0],
 'G':[3,2,0,0,0,3],'G7':[3,2,0,0,0,1],'Gmaj7':[3,2,0,0,0,2],
 'A':[-1,0,2,2,2,0],'Am':[-1,0,2,2,1,0],'A7':[-1,0,2,0,2,0],'Am7':[-1,0,2,0,1,0],'Amaj7':[-1,0,2,1,2,0],'Asus2':[-1,0,2,2,0,0],'Asus4':[-1,0,2,2,3,0],
 'B7':[-1,2,1,2,0,2]};
const ESH={'':[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,2,1,1,0,0],sus4:[0,2,2,2,0,0]};
const ASH={'':[-1,0,2,2,2,0],m:[-1,0,2,2,1,0],'7':[-1,0,2,0,2,0],m7:[-1,0,2,0,1,0],maj7:[-1,0,2,1,2,0],sus2:[-1,0,2,2,0,0],sus4:[-1,0,2,2,3,0],dim:[-1,0,1,2,1,-1]};
function shapeOf(ch){const m=ch.replace(/[()]/g,'').match(/^([A-H](?:#|b)?)([^/]*)/);if(!m)return null;
  let root=m[1],suf=m[2],approx=false;
  const r=noteIdx(root);if(r<0)return null;const rn=NOTES[r];
  let q=suf;if(q==='M7')q='maj7';if(q==='min')q='m';if(q==='sus')q='sus4';if(q==='min7')q='m7';
  const key=rn+q;if(OPEN[key])return{f:OPEN[key],approx:false};
  if(!(q in ESH)&&!(q in ASH)){approx=true;q=/^m(?!aj)/.test(q)?'m':''}   // 6, 9, add9 и т.п. — базовая форма
  if(OPEN[rn+q])return{f:OPEN[rn+q],approx};
  const fe=(r-4+12)%12, fa=(r-9+12)%12;   // лад баррэ на 6-й (E) и 5-й (A) струне
  const opts=[];
  if(q in ESH&&fe>0)opts.push({f:ESH[q].map(x=>x<0?-1:x+fe),fret:fe});
  if(q in ASH&&fa>0)opts.push({f:ASH[q].map(x=>x<0?-1:x+fa),fret:fa});
  if(!opts.length)return null;opts.sort((x,y)=>x.fret-y.fret);return{f:opts[0].f,approx}}
function diagramSVG(f){const fr=f.filter(x=>x>0),mx=Math.max(...fr,1),mn=Math.min(...fr,99);
  const start=mx<=4?1:mn;const W=150,H=150,x0=22,y0=26,dx=(W-2*x0)/5,dy=22;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Схема аккорда">';
  for(let i=0;i<6;i++)s+='<line class="ln" x1="'+(x0+i*dx)+'" y1="'+y0+'" x2="'+(x0+i*dx)+'" y2="'+(y0+5*dy)+'" stroke-width="1"/>';
  for(let j=0;j<=5;j++)s+='<line class="'+(j===0&&start===1?'nut':'ln')+'" x1="'+x0+'" y1="'+(y0+j*dy)+'" x2="'+(x0+5*dx)+'" y2="'+(y0+j*dy)+'" stroke-width="'+(j===0&&start===1?4:1)+'"/>';
  if(start>1)s+='<text class="tx" x="'+(x0+5*dx+6)+'" y="'+(y0+dy*.7)+'">'+start+'</text>';
  // баррэ: минимальный лад на нескольких струнах
  const bar=fr.length?Math.min(...fr):0,barS=f.map((x,i)=>x===bar?i:-1).filter(i=>i>=0);
  if(bar>0&&barS.length>=2&&barS[barS.length-1]-barS[0]>=2&&f.slice(barS[0],barS[barS.length-1]+1).every(x=>x>=bar)){const a=barS[0],b=barS[barS.length-1],y=y0+(bar-start+.5)*dy;
    s+='<rect class="dt" x="'+(x0+a*dx-6)+'" y="'+(y-6)+'" width="'+((b-a)*dx+12)+'" height="12" rx="6"/>'}
  f.forEach((x,i)=>{const cx=x0+i*dx;
    if(x<0)s+='<text class="tx" x="'+(cx-4)+'" y="'+(y0-8)+'">×</text>';
    else if(x===0)s+='<circle cx="'+cx+'" cy="'+(y0-12)+'" r="4" fill="none" class="ln" stroke-width="1.5"/>';
    else s+='<circle class="dt" cx="'+cx+'" cy="'+(y0+(x-start+.5)*dy)+'" r="7"/>'});
  return s+'</svg>'}


/* ---------- экран песни ---------- */
let cur=null;
function linksOf(s){const L=[];if(s.m)L.push({t:'mychords.net',href:'https://mychords.net/ru/'+s.m});if(s.k)L.push({t:'akkords.pro',href:'https://akkords.pro/songs/'+s.k});
  if(s.u)L.push({t:'Моя ссылка',href:s.u});
  if(!L.length)L.push({t:'Найти в Яндексе',href:'https://yandex.ru/search/?text='+encodeURIComponent(s.a.replace(/^Misc \w+/,'')+' '+s.s+' аккорды')});return L}
function openSong(s){if(!s)return;cur=s;const k=idOf(s),h=hue(s.a);
  $('sTitle').textContent=$('sNavTitle').textContent=s.s;$('sArtist').textContent=s.a;
  $('sArt').outerHTML=artHTML(s,500).replace('<span class="art"','<span class="art" id="sArt"');$('hero').style.setProperty('--aura','hsl('+h+' 75% 55%)');
  $('hero').style.setProperty('--cover',s.c?'url("'+COV(s.c,250)+'")':'none');
  $('backLbl').textContent=TITLES[tab];
  starSync();renderView();renderNext();hideDia();
  const p=$('song');p.classList.add('open');$('sBody').scrollTop=0;$('sNav').classList.remove('scrolled');document.body.style.overflow='hidden'}
function starSync(){const on=!!st.fav[idOf(cur)];const b=$('sStar');b.querySelector('path').style.fill=on?'var(--star)':'none';b.querySelector('path').style.stroke=on?'var(--star)':'currentColor';b.setAttribute('aria-pressed',on)}
function closeSong(){stopScroll();hideDia();$('song').classList.remove('open');document.body.style.overflow='';cur=null;renderHome()}
$('back').onclick=closeSong;
$('sBody').addEventListener('scroll',()=>$('sNav').classList.toggle('scrolled',$('sBody').scrollTop>50),{passive:true});
$('sStar').onclick=()=>{toggleFav(idOf(cur));starSync();toast(st.fav[idOf(cur)]?'Добавлено в вечер':'Убрано из вечера');renderNext()};
$('sMore').onclick=()=>{const s=cur,g=[[{t:has(s)?'Править аккорды':'Добавить аккорды',fn:openEditor,delay:320}],linksOf(s)];
  if(s.custom)g.push([{t:'Удалить песню',cls:'danger',fn:()=>confirmDelete(s),delay:320}]);actionSheet(esc(s.s),g)};
function confirmDelete(s){actionSheet('Удалить «'+esc(s.s)+'» вместе с аккордами?',[[{t:'Удалить песню',cls:'danger',fn:()=>{const k=idOf(s);
  st.custom=st.custom.filter(c=>c.a+'|'+c.s!==k);['chords','tr','capo','fav'].forEach(x=>delete st[x][k]);syncOrder();save();ALL=allSongs();closeSong();toast('Песня удалена')}}]])}

function renderView(){const k=idOf(cur),text=st.chords[k]||'',t=st.tr[k]||0,c=st.capo[k]||0,v=$('view');
  $('tVal').textContent=(t>0?'+':'')+t;$('cVal').textContent=c;
  document.documentElement.style.setProperty('--fs',st.fs+'px');
  $('player').hidden=!text.trim();
  const cn=$('capoNote');cn.hidden=!text.trim()||!c;
  if(c)cn.innerHTML='Каподастр на <b>'+c+' ладу</b> — показаны формы для зажима. Звучит как '+(t?'тон '+(t>0?'+':'')+t:'оригинал')+'.';
  if(!text.trim()){v.innerHTML='<div class="emptycard"><p>Своих аккордов к этой песне пока нет. Вставь текст с аккордами строкой над словами (<code>Am  F  C  G</code>) или прямо в тексте (<code>[Am]Белый снег</code>).</p><button class="pill primary" id="addCh">Добавить аккорды</button></div>'+
      '<p class="flabel" style="margin-top:22px">Аккорды на сайтах</p><div class="sites">'+linksOf(cur).map(l=>'<a href="'+esc(l.href)+'" target="_blank" rel="noopener">'+esc(l.t)+'<span>↗</span></a>').join('')+'</div>';
    $('addCh').onclick=openEditor;return}
  v.innerHTML='<pre class="chords"></pre>';v.firstChild.innerHTML=render(text,t-c)}
function openEditor(){const k=idOf(cur);openSheet('<div class="shnav gut"><button class="l" id="eCancel">Отмена</button><b>Аккорды</b><button class="r" id="eSave">Готово</button></div>'+
  '<div class="shbody gut" style="flex:1"><textarea class="ta" id="ed" style="flex:1;min-height:50vh" placeholder="Вставь сюда текст с аккордами"></textarea></div>',{tall:true});
  $('ed').value=st.chords[k]||'';setTimeout(()=>$('ed').focus(),350);
  $('eCancel').onclick=closeSheet;
  $('eSave').onclick=()=>{const val=$('ed').value;if(val.trim())st.chords[k]=val;else delete st.chords[k];save();closeSheet();renderView();renderNext();toast('Сохранено')}}
const trBy=d=>{const k=idOf(cur);st.tr[k]=(((st.tr[k]||0)+d+18)%12)-6;if(!st.tr[k])delete st.tr[k];save();renderView()};
const capoBy=d=>{const k=idOf(cur);st.capo[k]=Math.min(9,Math.max(0,(st.capo[k]||0)+d));if(!st.capo[k])delete st.capo[k];save();renderView()};
$('tDown').onclick=()=>trBy(-1);$('tUp').onclick=()=>trBy(1);$('cDown').onclick=()=>capoBy(-1);$('cUp').onclick=()=>capoBy(1);
const FS=[14,16,18,21,24];
$('fsBtn').onclick=()=>{const i=FS.indexOf(st.fs);st.fs=FS[(i+1)%FS.length]||16;save();renderView();toast('Размер текста: '+(FS.indexOf(st.fs)+1)+' из '+FS.length)};

/* следующая песня */
function idx(){return lastItems.findIndex(x=>idOf(x)===idOf(cur))}
function renderNext(){const i=idx(),w=$('nextWrap');w.innerHTML='';if(i<0||i>=lastItems.length-1)return;const n=lastItems[i+1];
  const b=document.createElement('button');b.className='nextcard';
  b.innerHTML=artHTML(n,120)+'<span style="min-width:0"><div class="lbl">Далее · '+(i+2)+' из '+lastItems.length+'</div><div class="t"></div></span><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
  b.querySelector('.t').textContent=n.s;b.onclick=()=>go(1);w.append(b)}
function go(d){const i=idx(),j=i+d;if(i<0||j<0||j>=lastItems.length)return;const was=!!raf;stopScroll();openSong(lastItems[j]);if(was&&has(lastItems[j]))startScroll()}

/* жесты на экране песни: от левого края — назад, свайп по тексту — соседняя песня */
(()=>{const p=$('song');let x0=0,y0=0,edge=false,dx=0,dir=0;
  p.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;edge=x0<24;dx=0;dir=0},{passive:true});
  p.addEventListener('touchmove',e=>{const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
    if(!dir)dir=Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.4?1:(Math.abs(my)>10?2:0);
    if(edge&&dir===1&&mx>0){dx=mx;p.classList.add('drag');p.style.transform='translateX('+mx+'px)'}},{passive:true});
  p.addEventListener('touchend',e=>{const t=e.changedTouches[0],mx=t.clientX-x0;
    if(edge&&dir===1){p.classList.remove('drag');p.style.transform='';if(dx>90)closeSong();return}
    if(dir===1&&!e.target.closest('.player')&&Math.abs(mx)>70)go(mx<0?1:-1)},{passive:true})})();

/* схема аккорда */
function hideDia(){$('dia').classList.remove('on')}
function showDia(ch){const d=$('dia'),sh=shapeOf(ch);
  d.innerHTML='<b>'+esc(ch)+'</b>'+(sh?diagramSVG(sh.f)+(sh.approx?'<small>упрощённая форма</small>':''):'<small>Схемы для этого аккорда нет</small>');
  d.classList.add('on');clearTimeout(showDia.t);showDia.t=setTimeout(hideDia,5000)}
$('dia').onclick=hideDia;
$('view').addEventListener('click',e=>{const c=e.target.closest('.c');if(c){e.stopPropagation();showDia(c.dataset.c)}else hideDia()});

/* автопрокрутка */
let raf=0,last=0,acc=0,lock=null;
$('speed').value=ls.get('sp','3');$('spdVal').textContent=$('speed').value;
function tick(ts){const b=$('sBody');if(last){acc+=(ts-last)/1000*(+$('speed').value)*9;const px=Math.floor(acc);if(px){b.scrollTop+=px;acc-=px}}
  last=ts;if(b.scrollTop+b.clientHeight>=b.scrollHeight-2){stopScroll();toast('Конец песни');return}raf=requestAnimationFrame(tick)}
async function startScroll(){if(raf)return;last=0;acc=0;raf=requestAnimationFrame(tick);$('speedRow').hidden=false;$('playIco').innerHTML='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  try{lock=await navigator.wakeLock?.request('screen')}catch(e){}}
function stopScroll(){cancelAnimationFrame(raf);raf=0;$('playIco').innerHTML='<path d="M7 4.5v15l13-7.5z"/>';try{lock&&lock.release()}catch(e){}lock=null}
$('playBtn').onclick=()=>raf?stopScroll():startScroll();
$('speed').oninput=e=>{$('spdVal').textContent=e.target.value;ls.set('sp',e.target.value)};

document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('sheet').hidden)closeSheet();else if($('dia').classList.contains('on'))hideDia();else if(cur)closeSong()});

renderHome();
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{})}
</script>
