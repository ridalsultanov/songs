<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Лад</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=lad">
<link rel="icon" href="icons/icon-192.png?v=lad">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Лад">
<style>
/* Layout: iOS-приложение — большой заголовок, поиск, список с алфавитом, стеклянный таб-бар; песня выезжает справа, внизу плавающая панель как у плеера.
   Палитра: системные нейтрали iOS + янтарь гитарной струны как единственный акцент */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --fg:#000000; --fg2:rgba(60,60,67,.62); --fg3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.22); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --accent:#D97800; --accent-ink:#FFFFFF; --chord:#C76E00; --glass:rgba(248,248,250,.8); --glass-line:rgba(0,0,0,.08);
  --danger:#FF3B30; --star:#F5B800; --shadow:0 12px 40px rgba(0,0,0,.18);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --fg:#FFFFFF; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#FF9F0A; --accent-ink:#1B1000; --chord:#FFB340; --glass:rgba(28,28,30,.72); --glass-line:rgba(255,255,255,.08);
  --danger:#FF453A; --star:#FFD60A; --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --fg:#FFFFFF; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34);
  --accent:#FF9F0A; --accent-ink:#1B1000; --chord:#FFB340; --glass:rgba(28,28,30,.72); --glass-line:rgba(255,255,255,.08);
  --danger:#FF453A; --star:#FFD60A; --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- навбар со сжимающимся заголовком ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:44px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:6px;align-items:center;transition:background .2s,box-shadow .2s}
.nav.scrolled{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.nav .mid{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;min-width:0}
.nav.scrolled .mid{opacity:1}
.nav .right{justify-self:end;display:flex;gap:4px}
.nav .left{justify-self:start}
.nbtn{height:36px;min-width:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-size:17px;border-radius:18px;padding:0 6px}
.nbtn svg.i{width:26px;height:26px}
.large{padding-block:2px 8px}
.large h1{overflow-wrap:anywhere;font-size:34px;font-weight:700;letter-spacing:.01em;margin:0;line-height:1.15}
.large p{margin:2px 0 0;color:var(--fg2);font-size:15px}
.search{position:relative;margin-block:6px 10px}
.search input{width:100%;height:36px;border:0;border-radius:10px;background:var(--fill);padding:0 32px 0 34px;font-size:17px;outline:none}
.search input::placeholder{color:var(--fg2)}
.search svg{position:absolute;left:9px;top:9px;width:18px;height:18px;stroke:var(--fg2)}
.search .clr{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:12px;color:var(--fg2);font-size:15px}
.actions{display:flex;gap:10px;margin-block:4px 14px}
.pill{height:44px;border-radius:12px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fill);color:var(--accent)}
.pill.primary{background:var(--accent);color:var(--accent-ink);flex:1}

/* ---------- список ---------- */
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.section-h{position:sticky;top:calc(44px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.04em;text-transform:uppercase;padding:14px 0 6px}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.cell{position:relative;overflow:hidden}
.cell .act{position:absolute;inset:0 0 0 auto;width:96px;display:flex;align-items:center;justify-content:center;background:var(--star);color:#1A1400;font-weight:600;font-size:14px;flex-direction:column;gap:2px}
.cell .act.rm{background:var(--fill2);color:var(--fg)}
.cell .fg{position:relative;background:var(--cell);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 14px 8px 12px;width:100%;text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.cell + .cell .fg::before{content:"";position:absolute;top:0;left:68px;right:0;height:.5px;background:var(--sep)}
.art{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.25);flex:none}
.art{position:relative;overflow:hidden}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.cell .txt{min-width:0}
.cell .t{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .a{font-size:14px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.cell .meta{display:flex;align-items:center;gap:6px;color:var(--fg3)}
.cell .meta .st{color:var(--star);font-size:13px}
.cell .meta .nt{color:var(--chord);font-size:13px}
.cell .meta svg{width:14px;height:14px;stroke:var(--fg3);stroke-width:2.5}
.num{width:24px;text-align:center;color:var(--fg2);font-variant-numeric:tabular-nums;font-size:15px}
.reo{display:flex;gap:2px}
.reo button{width:34px;height:34px;border-radius:17px;background:var(--fill);color:var(--fg);font-size:12px}
.reo button:disabled{opacity:.3}
.empty{color:var(--fg2);text-align:center;padding:60px 24px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--fg);font-size:20px;margin-bottom:6px}
.index{position:fixed;right:max(2px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;align-items:center;padding:4px 2px;touch-action:none}
.index button{font-size:10.5px;font-weight:600;color:var(--accent);line-height:1.25;width:18px}

/* ---------- таб-бар ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(3,1fr);max-width:560px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;color:var(--fg3);font-size:10.5px;font-weight:500}
.tab svg.i{width:26px;height:26px;stroke-width:1.8}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .badge{position:absolute;margin-left:22px;margin-top:-2px;background:var(--danger);color:#fff;border-radius:9px;font-size:11px;padding:0 5px;min-width:18px;line-height:18px}

/* ---------- экран песни ---------- */
.push{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.85,.25,1);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.push.open{transform:none}
.push.drag{transition:none}
.push .nav{position:relative;top:0}
.back{color:var(--accent);display:inline-flex;align-items:center;gap:2px;font-size:17px;height:44px;padding-right:8px}
.back svg{width:22px;height:22px;stroke-width:2.6}
.scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.hero{position:relative;padding-block:8px 18px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-60% -20% 0;background:radial-gradient(60% 60% at 30% 40%,var(--aura,transparent),transparent 70%);opacity:.45;pointer-events:none;filter:blur(10px)}
.hero::after{content:"";position:absolute;inset:-40px;background:var(--cover,none) center/cover;filter:blur(40px) saturate(1.4);opacity:.5;pointer-events:none;mask-image:linear-gradient(#000 40%,transparent);-webkit-mask-image:linear-gradient(#000 40%,transparent)}
.hero .row{position:relative;z-index:1;display:flex;gap:14px;align-items:center}
.hero .art{width:64px;height:64px;border-radius:14px;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.hero h2{margin:0;font-size:26px;font-weight:700;line-height:1.15;text-wrap:balance}
.hero p{margin:3px 0 0;color:var(--fg2);font-size:16px}
.capo-note{margin:0 0 12px;font-size:14px;color:var(--fg2);background:var(--fill);border-radius:10px;padding:8px 12px}
.capo-note b{color:var(--chord)}
pre.chords{margin:0;font-family:var(--f-mono);font-size:var(--fs,16px);line-height:1.6;white-space:pre-wrap;word-break:break-word;letter-spacing:0}
pre.chords .c{color:var(--chord);font-weight:700;cursor:pointer;border-radius:5px;padding:0 1px}
pre.chords .c:active{background:var(--fill2)}
.emptycard{background:var(--cell);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.emptycard p{margin:0;color:var(--fg2);font-size:15px;line-height:1.45}
.emptycard .pill{flex:none}
.emptycard code{font-family:var(--f-mono);color:var(--chord);font-size:14px}
.sites{display:flex;flex-direction:column;background:var(--cell);border-radius:12px;overflow:hidden}
.sites a{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;color:var(--accent);text-decoration:none}
.sites a + a{box-shadow:inset 0 .5px 0 var(--sep)}
.sites a span{color:var(--fg3)}
.nextcard{display:flex;align-items:center;gap:12px;width:100%;margin-top:28px;background:var(--cell);border-radius:14px;padding:12px 14px;text-align:left}
.nextcard .lbl{font-size:12px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.nextcard .t{font-weight:600}
.nextcard svg{margin-left:auto;stroke:var(--fg3)}
.pad-bottom{height:calc(90px + env(safe-area-inset-bottom,0px))}

/* плавающая панель */
.player{position:absolute;left:0;right:0;bottom:0;z-index:5;border-top:.5px solid var(--sep);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:6px;justify-content:space-between;width:100%;max-width:520px;margin:0 auto}
.step{display:flex;align-items:center;background:var(--fill);border-radius:12px;height:40px}
.step button{width:30px;height:40px;font-size:20px;color:var(--fg)}
.step output{min-width:38px;text-align:center;display:flex;flex-direction:column;line-height:1.05}
.step output b{font-size:15px;font-variant-numeric:tabular-nums}
.step output small{font-size:10px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.round{width:40px;height:40px;border-radius:20px;flex:none;display:grid;place-items:center;background:var(--fill);font-weight:700;font-size:15px}
.round.play{background:var(--accent);color:var(--accent-ink)}
.round.play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.speed{display:flex;align-items:center;gap:10px;padding:0 6px;width:100%;max-width:520px;margin:0 auto}
.speed input{flex:1;accent-color:var(--accent)}
.speed span{font-size:13px;color:var(--fg2);font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}

/* ---------- шиты и меню ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);border-radius:14px 14px 0 0;max-height:94%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.85,.25,1);padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet.tall{height:94%}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:6px auto 0}
.shnav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px}
.shnav b{font-weight:600}
.shnav .r{justify-self:end;color:var(--accent);font-weight:600}
.shnav .l{justify-self:start;color:var(--accent)}
.shbody{overflow-y:auto;padding-bottom:16px;display:flex;flex-direction:column;gap:18px}
.form{background:var(--cell);border-radius:12px;overflow:hidden}
.form input{display:block;width:100%;height:46px;border:0;background:none;padding:0 16px;font-size:17px;outline:none}
.form input + input{box-shadow:inset 0 .5px 0 var(--sep)}
.ta{width:100%;border:0;border-radius:12px;background:var(--cell);padding:14px 16px;font-family:var(--f-mono);font-size:15px;line-height:1.5;outline:none;resize:none}
.flabel{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px 16px}
.menu{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.menu .grp{border-radius:14px;overflow:hidden}
.menu .grp > *{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;font-size:19px;color:var(--accent);text-decoration:none;background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.menu .grp > * + *{box-shadow:inset 0 .5px 0 var(--sep)}
.menu .grp .ttl{height:auto;padding:14px;font-size:13px;color:var(--fg2);flex-direction:column}
.menu .grp .danger{color:var(--danger)}
.menu .grp .chk{color:var(--fg)}
.menu .grp .chk.on::after{content:"✓";color:var(--accent);margin-left:6px;font-weight:700}
.menu .cancel{font-weight:600}
.actsheet{background:transparent;padding-inline:max(8px,env(safe-area-inset-left,0px));}
.note{font-size:13px;color:var(--fg2);line-height:1.45;margin:0 4px}

/* схема аккорда */
.dia{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;transform:translate(-50%,10px) scale(.96);opacity:0;pointer-events:none;transition:all .2s;border-radius:20px;border:.5px solid var(--glass-line);box-shadow:var(--shadow);padding:14px 18px 12px;text-align:center;width:200px}
.dia.on{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.dia b{font-family:var(--f-mono);font-size:20px;color:var(--chord)}
.dia small{display:block;color:var(--fg2);font-size:12px;margin-top:4px}
.dia svg{display:block;margin:8px auto 0;width:140px;height:auto}
.dia svg .ln{stroke:var(--fg3)} .dia svg .nut{stroke:var(--fg)} .dia svg .dt{fill:var(--fg)} .dia svg .tx{fill:var(--fg2);font-family:var(--f-mono);font-size:11px}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;transition:all .25s;z-index:90;border-radius:20px;padding:10px 18px;font-size:15px;font-weight:600;box-shadow:var(--shadow);border:.5px solid var(--glass-line);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 1.1 */
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sd{flex:none;width:68px;background:var(--cell);border-radius:12px;padding:6px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.sd svg{width:58px;height:auto}
.sd svg .ln{stroke:var(--fg3)} .sd svg .nut{stroke:var(--fg)} .sd svg .dt{fill:var(--fg)} .sd svg .tx{fill:var(--fg2);font-family:var(--f-mono);font-size:11px}
.sd b{font-family:var(--f-mono);font-size:13px;color:var(--chord)}
.sd .nod{height:58px;display:grid;place-items:center;color:var(--fg3)}
.stage .nav,.stage .hero,.stage .strip,.stage .capo-note,.stage #nextWrap,.stage .player{display:none!important}
.stage .scroller{padding-top:12px}
.stage pre.chords{line-height:1.7}
.stage-exit{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:6;width:40px;height:40px;border-radius:20px;border:.5px solid var(--glass-line);font-size:16px;color:var(--fg)}
.round.stg svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.pastebar{display:flex;gap:8px}
.pastebar .pill{flex:1;height:38px;font-size:15px}
.tn-lvl{width:100%;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.tn-lvl i{display:block;height:100%;width:0;background:#34C759;transition:width .08s}
.sd.simp{justify-content:center;gap:6px;background:var(--fill);color:var(--accent)}
.sd.simp .ico{font-size:24px;line-height:58px;height:58px}
.sd.simp.on{background:var(--accent);color:var(--accent-ink)}
.sd.simp.on b{color:var(--accent-ink)}
.groove{display:flex;align-items:center;gap:8px;background:var(--cell);border-radius:12px;padding:6px 6px 6px 10px;margin:0 0 12px}
.gv-pat{flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;font-size:20px;font-weight:700}
.gv-pat span{min-width:22px;text-align:center;border-radius:6px;color:var(--fg)}
.gv-pat span.off{color:var(--fg2)}
.gv-pat span.now{background:var(--accent);color:var(--accent-ink)}
.gv-bpm{height:34px;padding:0 10px;border-radius:10px;background:var(--fill);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.gv-play{width:34px;height:34px;border-radius:17px;background:var(--accent);color:var(--accent-ink);font-size:14px}
.gv-play.on{background:var(--fg);color:var(--bg)}
.stage .groove{position:sticky;top:0;z-index:3;display:flex!important;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.stage .groove[hidden]{display:none!important}
.gpresets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gp{background:var(--cell);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;border:2px solid transparent}
.gp b{font-size:15px}.gp span{color:var(--fg2);font-size:15px;letter-spacing:.05em}
.gp.on{border-color:var(--accent)}
.tempo{display:flex;align-items:center;gap:10px}
.tempo b{font-size:28px;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.tempo .pill{height:40px;padding:0 16px}
.blind .c{color:transparent!important;background:var(--fill2);border-radius:6px;min-width:1.8em;display:inline-block;text-align:center}
.blind .c::after{content:"?";color:var(--fg3);position:relative}

6b48b8998221bd764e"},{"a":"Кино","s":"Апрель","m":"kino/64467-kino-aprel.html","k":"kino/aprel/","c":"b4076a916063e924824664e18292fad2"},{"a":"Кино","s":"Мама, мы все сошли с ума","m":"kino/1111-kino-mama-my-vse-soshli-s-uma.html","c":"b39e82e1e4fdaf3f08ae582e8c9565cd"},{"a":"Кино","s":"Последний герой","m":"kino/1141-kino-poslednij-geroj.html","k":"kino/poslednij-geroj/","c":"72854c811a50236b48b8998221bd764e"},{"a":"Кино","s":"Алюминиевые огурцы","m":"kino/273602-kino-alyuminiyevyye-ogurtsy.html","k":"kino/aljuminievye-ogurcy/","c":"37b0ced101537d62cec9a48962b344bf"},{"a":"Кино","s":"Война","m":"kino/1067-kino-vojna.html","k":"kino/voyna-2/","c":"db588cbe37c78a037e8eeb382dff1753"},{"a":"Кино","s":"Песня без слов","m":"kino/1133-kino-pesnya-bez-slov.html","k":"kino/pesnja-bez-slov/","c":"b4076a916063e924824664e18292fad2"},{"a":"Кино","s":"Красно-жёлтые дни","m":"kino/1102-kino-krasno-zheltye-dni.html","k":"kino/krasno-zhyoltye-dni/","c":"72854c811a50236b48b8998221bd764e"},{"a":"Кино","s":"Видели ночь","m":"kino/1065-kino-videli-noch.html","k":"kino/videli-noch/","c":"f6eb38e5f1d70e6af48fdc7b10d426c1"},{"a":"Кино","s":"Печаль","m":"kino/1137-kino-pechal.html","k":"kino/pechal/","c":"b4076a916063e924824664e18292fad2"},{"a":"Кино","s":"Следи за собой","m":"kino/1159-kino-sledi-za-soboj.html","k":"kino/sledi-za-soboy/","c":"21fb9d53b9114edceac0836d45e15f7e"},{"a":"Кино","s":"Бошетунмай","m":"kino/273607-kino-boshetunmay.html","k":"kino/boshetunmay/","c":"b39e82e1e4fdaf3f08ae582e8c9565cd"},{"a":"Кино","s":"Легенда","m":"kino/248633-kino-legenda.html","k":"kino/legenda/","c":"b39e82e1e4fdaf3f08ae582e8c9565cd"},{"a":"Кино","s":"Звёзды останутся здесь","m":"kino/272034-kino-zvezdy-ostanutsya-zdes.html","c":"f6eb38e5f1d70e6af48fdc7b10d426c1"},{"a":"Кино","s":"Это не любовь","m":"kino/244814-kino-eto-ne-lyubov.html","k":"kino/eto-ne-lyubov/","c":"77a31ba75523944643f0cdf0b607400d"},{"a":"Кино","s":"Нам с тобой","m":"kino/266715-kino-nam-s-toboy.html","k":"kino/nam-s-toboj/","c":"21fb9d53b9114edceac0836d45e15f7e"},{"a":"Кино","s":"Электричка","m":"kino/277267-kino-elektrichka.html","k":"kino/elektrichka/","c":"db588cbe37c78a037e8eeb382dff1753"},{"a":"Кино","s":"Троллейбус","m":"kino/1172-kino-trollejbus.html","k":"kino/trolleybus/","c":"db588cbe37c78a037e8eeb382dff1753"},{"a":"Кино","s":"Когда твоя девушка больна","m":"kino/1098-kino-kogda-tvoya-devushka-bolna.html","k":"kino/kogda-tvoya-devushka-bolna/","c":"21fb9d53b9114edceac0836d45e15f7e"},{"a":"Кино","s":"Дальше действовать будем мы","m":"kino/1080-kino-dalshe-dejstvovat-budem-my.html","k":"kino/dalshe-deystvovat-budem-my/","c":"b39e82e1e4fdaf3f08ae582e8c9565cd"},{"a":"Кино","s":"Муравейник","m":"kino/1119-kino-muravejnik.html","k":"kino/muraveynik/","c":"21fb9d53b9114edceac0836d45e15f7e"}];
SONGS.forEach((s,i)=>s.id=i);
const KEY='pesennik.david.v1';
let st={fav:{},chords:{},tr:{},capo:{},simp:{},simpPrev:{},strum:{},bpm:{},learn:{},notes:{},hard:{},played:{},pc:{},custom:[],pl:[],order:[],hist:[],fs:16};
try{const raw=localStorage.getItem(KEY);if(raw)st=Object.assign(st,JSON.parse(raw))}catch(e){}
['fav','chords','tr','capo','simp','simpPrev','strum','bpm','learn','notes','hard','played','pc'].forEach(k=>{if(!st[k]||typeof st[k]!=='object')st[k]={}});
if(!Array.isArray(st.custom))st.custom=[];if(!Array.isArray(st.order))st.order=[];if(!Array.isArray(st.pl))st.pl=[];
function save(){st.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}if(typeof push==='function')push()}
const ls={get(k,d){try{const v=localStorage.getItem(KEY+'.'+k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(KEY+'.'+k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const idOf=s=>s.a+'|'+s.s;
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1700)}
const norm=t=>(t||'').toLowerCase().replace(/ё/g,'е');
const pl=n=>n+' '+(n%10===1&&n%100!==11?'песня':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'песни':'песен');

/* обложка-инициалы: цвет из имени исполнителя */
function hue(str){let h=0;for(const c of str)h=(h*31+c.codePointAt(0))%360;return h}
function initials(a){a=a.replace(/^Misc\s+\w+/,'♪').replace(/\(.*?\)/g,'').trim();if(a==='♪')return '♪';
  const w=a.split(/[\s\-&]+/).filter(Boolean);return ((w[0]||'')[0]+(w[1]?w[1][0]:(w[0]||'')[1]||'')).toUpperCase()}
const COVER_BASE='../covers/';
const COV=(m,n)=>COVER_BASE+m+'.jpg';
function coverURL(s){if(s.c)return COV(s.c);try{if(s.cs&&sync&&sync.url)return sync.url.replace(/\/+$/,'')+'/cover/'+s.cs+'.jpg'}catch(e){}return ''}
function artHTML(s,size,cls){const cu=coverURL(s);return '<span class="art'+(cls?' '+cls:'')+'" style="'+artStyle(s.a)+'">'+esc(initials(s.a))+(cu?'<img src="'+cu+'" alt="" loading="lazy" decoding="async" onerror="this.remove()">':'')+'</span>'}
function artStyle(a){const h=hue(a);return 'background:linear-gradient(140deg,hsl('+h+' 70% 58%),hsl('+((h+40)%360)+' 65% 38%))'}

/* ---------- данные ---------- */
function allSongs(){return st.custom.map(c=>({a:c.a,s:c.s,u:c.u,c:c.c,cs:c.cs,id:-c.t,custom:true})).concat(SONGS)}
let ALL=allSongs();
const has=s=>!!(st.chords[idOf(s)]||'').trim();
function syncOrder(){const f=new Set(Object.keys(st.fav).filter(k=>st.fav[k]));st.order=st.order.filter(k=>f.has(k));f.forEach(k=>{if(!st.order.includes(k))st.order.push(k)})}
function toggleFav(k){if(st.fav[k])delete st.fav[k];else st.fav[k]=true;syncOrder();save();updateBadge()}
syncOrder();

/* ---------- вкладки ---------- */
let tab=ls.get('tab','all'); if(!['all','eve','mine'].includes(tab))tab='all';
let sort=ls.get('sort2','added'); if(!['added','song','artist'].includes(sort))sort='added';
let editSet=false, lastItems=[];
const TITLES={all:'Песни',eve:'Вечер',mine:'Мои'};
let curPl=ls.get('pl','')||null;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='eve'&&tab==='eve'){curPl=null;ls.set('pl','')}
  tab=b.dataset.tab;ls.set('tab',tab);editSet=false;window.scrollTo(0,0);renderHome()});
function updateBadge(){}

/* ---------- плейлисты ---------- */
const plGet=id=>id==='fav'?{id:'fav',name:'Избранное',fav:true,songs:st.order}:st.pl.find(p=>p.id===id);
const plList=()=>[plGet('fav')].concat(st.pl);
const byKey=k=>ALL.find(x=>idOf(x)===k);
const plKeys=id=>{const p=plGet(id);return p?p.songs.filter(k=>byKey(k)):[]};
const plHas=(id,k)=>id==='fav'?!!st.fav[k]:!!(plGet(id)&&plGet(id).songs.includes(k));
const inAnyPl=k=>!!st.fav[k]||st.pl.some(p=>p.songs.includes(k));
function plToggle(id,k){if(id==='fav'){toggleFav(k);return}const p=plGet(id);if(!p)return;const i=p.songs.indexOf(k);if(i>=0)p.songs.splice(i,1);else p.songs.push(k);save()}
function plNew(name,keys){const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name.trim()||'Новый плейлист',songs:(keys||[]).slice(),t:Date.now()};st.pl.push(p);save();return p}
function collage(id,cls){const keys=plKeys(id),songs=keys.map(byKey).filter(Boolean);
  const withCover=songs.filter(s=>coverURL(s));
  if(!songs.length)return '<span class="col empty'+(cls?' '+cls:'')+'">'+(id==='fav'?'★':'♪')+'</span>';
  if(withCover.length>=4)return '<span class="col grid'+(cls?' '+cls:'')+'">'+withCover.slice(0,4).map(s=>'<img src="'+coverURL(s)+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">').join('')+'</span>';
  return '<span class="col one'+(cls?' '+cls:'')+'">'+artHTML(withCover[0]||songs[0],250)+'</span>'}

/* ---------- главный экран ---------- */
function filtered(){const q=norm($('q').value.trim());
  let items;
  if(tab==='eve')items=curPl?plKeys(curPl).map(byKey):[];
  else items=ALL.filter(s=>tab==='mine'?(has(s)||s.custom):true);
  if(q)items=items.filter(s=>norm(s.s+' '+s.a+' '+(st.chords[idOf(s)]||'')).includes(q));
  if(tab==='eve')return items;
  const col=(x,y)=>x.localeCompare(y,'ru',{sensitivity:'base'});
  if(sort==='song')items.sort((x,y)=>col(x.s,y.s)||col(x.a,y.a));
  else if(sort==='artist')items.sort((x,y)=>col(x.a,y.a)||col(x.s,y.s));
  else items.sort((x,y)=>x.id-y.id);
  return items}
function letterOf(s){const k=(sort==='artist'?s.a:s.s).replace(/^Misc\s+\w+/,'').trim();
  let c=(k[0]||'#').toUpperCase().replace('Ё','Е');c=c.normalize('NFD')[0];
  return /[А-Я]/.test(c)?c:/[A-Z]/.test(c)?c:'#'}
const LORDER=l=>/[А-Я]/.test(l)?0:/[A-Z]/.test(l)?1:2;
function navFor(){const inPl=tab==='eve'&&!!curPl&&!!plGet(curPl),pl=inPl?plGet(curPl):null;
  $('plBack').hidden=!inPl;
  $('addBtn').hidden=false;$('addBtn').setAttribute('aria-label',tab==='eve'?(inPl?'Добавить песни':'Новый плейлист'):'Добавить песню');
  $('moreBtn').hidden=tab==='eve';$('plMore').hidden=!inPl;$('histBtn').hidden=!(tab==='eve'&&!inPl);
  $('editSet').hidden=!inPl||!plKeys(curPl).length;$('editSet').textContent=editSet?'Готово':'Править';
  $('searchWrap').hidden=tab==='eve'&&!inPl;
  const title=inPl?pl.name:TITLES[tab];$('bigTitle').textContent=$('navTitle').textContent=title;return inPl}
function renderHome(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  if(tab==='eve'&&curPl&&!plGet(curPl)){curPl=null;ls.set('pl','')}
  const inPl=navFor();renderDay();
  if(tab==='eve'&&!inPl){renderPlaylists();return}
  const items=filtered();lastItems=items;
  const total=tab==='all'?ALL.length:inPl?plKeys(curPl).length:items.length;
  $('count').textContent=$('q').value.trim()?items.length+' из '+pl(total):pl(items.length);
  $('eveActions').hidden=!inPl||!items.length||editSet;
  const L=$('list');L.innerHTML='';
  $('plHeroBox').innerHTML=inPl&&!$('q').value.trim()?'<div class="plhero">'+collage(curPl,'big')+'</div>':'';
  if(!items.length){const msg=$('q').value.trim()?['Ничего не нашлось','Попробуй другое слово.']:
      inPl?['Плейлист пуст','Нажми ＋ вверху и отметь песни. Или смахни песню влево в общем списке → «В плейлист».']:
      tab==='mine'?['Пока пусто','Здесь будут песни, к которым ты добавил свои аккорды, и песни, добавленные кнопкой ＋.']:['Песен пока нет','Нажми ＋ вверху и добавь первую.'];
    L.insertAdjacentHTML('beforeend','<div class="empty"><b>'+msg[0]+'</b>'+msg[1]+'</div>');$('index').hidden=true;return}
  const grouped=tab!=='eve'&&sort!=='added'&&!$('q').value.trim();
  let grp=null;const letters=[];
  const frag=document.createDocumentFragment();
  const newGroup=()=>{grp=document.createElement('div');grp.className='group';frag.append(grp)};
  if(!grouped){const sp=document.createElement('div');sp.style.height='4px';frag.append(sp);newGroup()}
  if(grouped){const buckets=new Map();items.forEach(s=>{const l=letterOf(s);if(!buckets.has(l))buckets.set(l,[]);buckets.get(l).push(s)});
    const keys=[...buckets.keys()].sort((a,b)=>LORDER(a)-LORDER(b)||a.localeCompare(b,'ru'));
    const flat=[];keys.forEach(l=>{letters.push(l);const h=document.createElement('div');h.className='section-h';h.id='sec-'+l;h.textContent=l;frag.append(h);newGroup();
      buckets.get(l).forEach(s=>{flat.push(s);grp.append(cellFor(s,flat.length-1,items.length))})});
    lastItems=flat}
  else items.forEach((s,i)=>grp.append(cellFor(s,i,items.length)));
  L.append(frag);
  const ix=$('index');ix.hidden=!grouped||letters.length<6;ix.innerHTML='';
  letters.forEach(l=>{const b=document.createElement('button');b.textContent=l;b.dataset.l=l;ix.append(b)});
}
function renderPlaylists(){const L=$('list');L.innerHTML='';$('plHeroBox').innerHTML='';$('index').hidden=true;$('eveActions').hidden=true;lastItems=[];
  const all=plList();$('count').textContent=all.length===1?'Создай первый плейлист кнопкой ＋':(all.length-1)+' '+(n=>n%10===1&&n%100!==11?'плейлист':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'плейлиста':'плейлистов')(all.length-1)+' и Избранное';
  const g=document.createElement('div');g.className='group';g.style.marginTop='4px';
  all.forEach(p=>{const n=plKeys(p.id).length;const b=document.createElement('button');b.className='plrow';
    b.innerHTML=collage(p.id)+'<span class="txt"><div class="t"></div><div class="a">'+pl(n)+'</div></span><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
    b.querySelector('.t').textContent=(p.fav?'★ ':'')+p.name;b.onclick=()=>{curPl=p.id;ls.set('pl',p.id);editSet=false;window.scrollTo(0,0);renderHome()};g.append(b)});
  L.append(g);
  const nb=document.createElement('button');nb.className='pill newpl';nb.innerHTML='＋ Новый плейлист';nb.onclick=newPlaylistFlow;L.append(nb);
  const bb=document.createElement('button');bb.className='pill primary bld';bb.innerHTML='✦ Собрать вечер';bb.onclick=openBuilder;L.append(bb)}
function cellFor(s,i,n){const k=idOf(s),fav=!!st.fav[k],inPl=tab==='eve'&&!!curPl;
  const c=document.createElement('div');c.className='cell';
  const act=document.createElement('button');act.className='act'+(inPl?' rm':'');act.innerHTML=inPl?'<span>⊖</span>Убрать':'<span>＋</span>В плейлист';act.tabIndex=-1;
  const fg=document.createElement('button');fg.className='fg';
  const lead=inPl?'<span class="num">'+(i+1)+'</span>':artHTML(s,120);
  const meta=inPl&&editSet?'<span class="reo"><button data-d="-1" aria-label="Выше"'+(i===0?' disabled':'')+'>▲</button><button data-d="1" aria-label="Ниже"'+(i===n-1?' disabled':'')+'>▼</button><button data-rm="1" class="rmb" aria-label="Убрать из плейлиста">⊖</button></span>':
    '<span class="meta">'+(isLearned(k)?'<span class="lk">✓</span>':'')+(fav&&!inPl?'<span class="st">★</span>':'')+(has(s)?'<span class="nt">♪</span>':'')+'<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>';
  fg.innerHTML=lead+'<span class="txt"><div class="t"></div><div class="a"></div></span>'+meta;
  fg.querySelector('.t').textContent=s.s;fg.querySelector('.a').textContent=s.a+(s.custom?' · добавлена':'');
  c.append(act,fg);
  fg.onclick=e=>{const r=e.target.closest('.reo button');if(r){e.stopPropagation();if(r.dataset.rm){plToggle(curPl,k);renderHome();return}moveInSet(k,+r.dataset.d);return}
    if(c.classList.contains('opened')){closeSwipe(c);return}openSong(s)};
  act.onclick=()=>{if(inPl){plToggle(curPl,k);toast('Убрано из «'+plGet(curPl).name+'»');renderHome()}else{closeSwipe(c);openPicker(s)}};
  attachSwipe(c,fg);return c}
function moveInSet(k,d){const arr=plGet(curPl).songs,i=arr.indexOf(k),j=i+d;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();renderHome()}

/* выбор плейлистов для песни */
function openPicker(s){const k=idOf(s);
  const rows=()=>plList().map(p=>'<button class="pk" data-id="'+p.id+'">'+collage(p.id,'sm')+'<span class="txt"><div class="t">'+esc((p.fav?'★ ':'')+p.name)+'</div><div class="a">'+pl(plKeys(p.id).length)+'</div></span><span class="chk'+(plHas(p.id,k)?' on':'')+'">✓</span></button>').join('');
  const sh=openSheet('<div class="shnav gut"><span></span><b>В плейлист</b><button class="r" id="pkDone">Готово</button></div><div class="shbody gut"><p class="note">«'+esc(s.s)+'» — отметь плейлисты:</p><div class="group" id="pkList">'+rows()+'</div><button class="pill" id="pkNew">＋ Новый плейлист</button></div>',{onClose:()=>{renderHome();if(cur)starSync()}});
  const wire=()=>sh.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{plToggle(b.dataset.id,k);$('pkList').innerHTML=rows();wire()});wire();
  $('pkDone').onclick=closeSheet;

/* ---------- аккорды: распознавание, транспонирование ---------- */
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#','Cb':'B','Fb':'E','E#':'F','B#':'C'};
const CHORD=/^\(?([A-H](?:#|b)?)((?:maj|min|dim|aug|sus|add|m|M|\+|°|ø|\d|\(|\)|b|#)*)(?:\/([A-H](?:#|b)?))?\)?$/;
function noteIdx(n){if(n==='H')return 11;n=FLAT[n]||n;return NOTES.indexOf(n)}
const OUT=['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'];
function shift(n,t){const i=noteIdx(n);if(i<0)return n;let r=OUT[((i+t)%12+12)%12];if(n==='H'&&r==='B')r='H';return r}
let SIMP=false;
function simpleName(c){const m=c.replace(/[()]/g,'').match(/^([A-H](?:#|b)?)([^/]*)/);if(!m)return c;const s=m[2];
  const r=/^(m(?!aj)|min)/.test(s)||/^dim/.test(s)?'m':s==='7'?'7':'';return m[1]+r}
const trChord=(c,t)=>trChord0(SIMP?simpleName(c):c,t);
function trChord0(c,t){if(!CHORD.test(c)||!t)return c;
  return c.replace(/^(\(?)([A-H](?:#|b)?)/,(x,p,n)=>p+shift(n,t)).replace(/\/([A-H](?:#|b)?)/,(x,n)=>'/'+shift(n,t))}
const isChord=w=>CHORD.test(w);
const cspan=c=>'<span class="c" data-c="'+esc(c)+'">'+esc(c)+'</span>';
function render(text,t){
  return text.split('\n').map(line=>{
    if(/\[[A-H][^\]]*\]/.test(line))return esc(line).replace(/\[([A-H][^\]]*)\]/g,(x,c)=>isChord(c)?cspan(trChord(c,t)):'['+c+']');
    const words=line.trim().split(/\s+/).filter(Boolean);
    const chordLine=words.length&&words.every(w=>isChord(w)||/^[|\-–x×\d:.]+$/.test(w));
    if(!chordLine)return esc(line);
    return line.replace(/\S+/g,w=>isChord(w)?cspan(trChord(w,t)):esc(w));
  }).join('\n')}

/* ---------- умное оформление текста при показе (исходник не меняется) ---------- */
const SECTW='куплет|припев|пред-?припев|бридж|переход|проигрыш|вступление|интро|кода|окончание|концовка|соло|модуляция|intro|verse|chorus|pre-?chorus|bridge|outro|solo|interlude|instrumental';
const SECT=new RegExp('^\\s*[\\[(]?\\s*('+SECTW+')(?=[\\s\\d:\\])]|$)[^\\])]*?[\\])]?\\s*:?\\s*$','i');
const SECT_INLINE=new RegExp('^\\s*[\\[(]?\\s*(('+SECTW+')(?=[\\s\\d:\\])]|$)[^:\\])]*)[\\])]?\\s*:\\s*(.+)$','i');
const REP=/\s*[(\[]?\s*(?:[xх×]\s*(\d)|(\d)\s*[xх×]|(\d)\s*раз[а]?)\s*[)\]]?\s*$/i;
const SEP=/^[|\-–—/\\.:,*()]+$/;
const chordTok=w=>isChord(w.replace(/[,.;]$/,''));
function isChordLine(l){const w=l.replace(REP,'').trim().split(/\s+/).filter(Boolean);return w.length>0&&w.some(chordTok)&&w.every(x=>chordTok(x)||SEP.test(x))}
function repBadge(l){const m=l.match(REP);if(!m||!l.replace(REP,'').trim())return[l,''];return[l.replace(REP,''),'<span class="rep">×'+(m[1]||m[2]||m[3])+'</span>']}
const chH=(c,t)=>{const v=trChord(c.replace(/[,.;]$/,''),t);return '<b class="c" data-c="'+esc(v)+'">'+esc(v)+'</b>'};
const fixDash=s=>s.replace(/^[-–—]\s*/,'— ');
// lyr — строка текста, chords — [[позиция, аккорд]]; аккорд цепляется к слову, в которое попадает
function wordLine(lyr,chords,t,tail){lyr=fixDash(lyr.replace(/\s+$/,''));
  const words=[];lyr.replace(/\S+/g,(w,p)=>{words.push({s:p,t:w,ch:[]});return w});
  const extra=[];
  chords.forEach(([p,c])=>{if(!words.length||p>words[words.length-1].s+words[words.length-1].t.length+1){extra.push(c);return}
    let k=0;while(k<words.length-1&&words[k+1].s<=p)k++;words[k].ch.push(c)});
  const merged=[];let carry=[];words.forEach(w=>{if(/^[,.!?;:…]+$/.test(w.t)&&merged.length){merged[merged.length-1].t+=w.t;carry=carry.concat(w.ch)}else{w.ch=carry.concat(w.ch);carry=[];merged.push(w)}});
  if(carry.length)extra.unshift(...carry);
  const any=chords.length>0;
  const html=merged.map(w=>any?(w.ch.length?'<span class="w"><span class="cc">'+w.ch.map(c=>chH(c,t)).join(' ')+'</span>'+esc(w.t)+'</span>':'<span class="w">'+esc(w.t)+'</span>'):esc(w.t)).join(' ')+
    (extra.length?' <span class="w"><span class="cc">'+extra.map(c=>chH(c,t)).join(' ')+'</span>&nbsp;</span>':'');
  return '<div class="ln'+(any?' wl':'')+'">'+html+tail+'</div>'}
function chordOnly(l,t){const [body,tail]=repBadge(l);return '<div class="ln cl">'+body.trim().split(/\s+/).filter(w=>!SEP.test(w)).map(w=>chordTok(w)?chH(w,t):esc(w)).join('')+tail+'</div>'}
function renderNice(text,t){const L=text.replace(/\r/g,'').split('\n');const out=[];let gap=false;
  const push=h=>{out.push(h);gap=false};const brk=()=>{if(out.length&&!gap){out.push('<div class="gap"></div>');gap=true}};
  for(let i=0;i<L.length;i++){let l=L[i].replace(/\u00a0/g,' ').replace(/\t/g,'    ');
    if(!l.trim()){brk();continue}
    const si=l.match(SECT_INLINE);
    if(si&&isChordLine(si[3])){brk();push('<div class="sect">'+esc(si[1].trim())+'</div>');push(chordOnly(si[3],t));continue}
    if(SECT.test(l)){brk();push('<div class="sect">'+esc(l.replace(/[\[\]():]/g,'').trim())+'</div>');continue}
    if(/\[[A-H][^\]]*\]/.test(l)){const [body,tail]=repBadge(l);let lyr='';const cs=[];
      body.split(/(\[[A-H][^\]]*\])/).forEach(part=>{const m=part.match(/^\[([A-H][^\]]*)\]$/);if(m&&isChord(m[1]))cs.push([lyr.length,m[1]]);else lyr+=part});
      push(wordLine(lyr,cs,t,tail));continue}
    if(isChordLine(l)){const nxt=L[i+1];
      if(nxt!==undefined&&nxt.trim()&&!isChordLine(nxt)&&!SECT.test(nxt)&&!/\[[A-H][^\]]*\]/.test(nxt)){
        const [lyr,tail]=repBadge(nxt.replace(/\t/g,'    ').replace(/\u00a0/g,' '));const cs=[];l.replace(/\S+/g,(w,p)=>{if(chordTok(w))cs.push([p,w]);return w});
        push(wordLine(lyr,cs,t,tail));i++;continue}
      push(chordOnly(l,t));continue}
    const [body,tail]=repBadge(l);push(wordLine(body,[],t,tail))}
  while(out.length&&out[out.length-1].includes('gap'))out.pop();return '<div class="nice">'+out.join('')+'</div>'}

/* ---------- схемы аккордов ---------- */
// струны E A D G B e; -1 = не играть
const OPEN={'C':[-1,3,2,0,1,0],'C7':[-1,3,2,3,1,0],'Cmaj7':[-1,3,2,0,0,0],'Cadd9':[-1,3,2,0,3,0],
 'D':[-1,-1,0,2,3,2],'Dm':[-1,-1,0,2,3,1],'D7':[-1,-1,0,2,1,2],'Dm7':[-1,-1,0,2,1,1],'Dmaj7':[-1,-1,0,2,2,2],'Dsus2':[-1,-1,0,2,3,0],'Dsus4':[-1,-1,0,2,3,3],
 'E':[0,2,2,1,0,0],'Em':[0,2,2,0,0,0],'E7':[0,2,0,1,0,0],'Em7':[0,2,2,0,3,0],'Esus4':[0,2,2,2,0,0],
 'F':[1,3,3,2,1,1],'Fmaj7':[-1,-1,3,2,1,0],
 'G':[3,2,0,0,0,3],'G7':[3,2,0,0,0,1],'Gmaj7':[3,2,0,0,0,2],
 'A':[-1,0,2,2,2,0],'Am':[-1,0,2,2,1,0],'A7':[-1,0,2,0,2,0],'Am7':[-1,0,2,0,1,0],'Amaj7':[-1,0,2,1,2,0],'Asus2':[-1,0,2,2,0,0],'Asus4':[-1,0,2,2,3,0],
 'B7':[-1,2,1,2,0,2]};
const ESH={'':[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,2,1,1,0,0],sus4:[0,2,2,2,0,0]};
const ASH={'':[-1,0,2,2,2,0],m:[-1,0,2,2,1,0],'7':[-1,0,2,0,2,0],m7:[-1,0,2,0,1,0],maj7:[-1,0,2,1,2,0],sus2:[-1,0,2,2,0,0],sus4:[-1,0,2,2,3,0],dim:[-1,0,1,2,1,-1]};
function shapeOf(ch){const m=ch.replace(/[()]/g,'').match(/^([A-H](?:#|b)?)([^/]*)/);if(!m)return null;
  let root=m[1],suf=m[2],approx=false;
  const r=noteIdx(root);if(r<0)return null;const rn=NOTES[r];
  let q=suf;if(q==='M7')q='maj7';if(q==='min')q='m';if(q==='sus')q='sus4';if(q==='min7')q='m7';
  const key=rn+q;if(OPEN[key])return{f:OPEN[key],approx:false};
  if(!(q in ESH)&&!(q in ASH)){approx=true;q=/^m(?!aj)/.test(q)?'m':''}   // 6, 9, add9 и т.п. — базовая форма
  if(OPEN[rn+q])return{f:OPEN[rn+q],approx};
  const fe=(r-4+12)%12, fa=(r-9+12)%12;   // лад баррэ на 6-й (E) и 5-й (A) струне
  const opts=[];
  if(q in ESH&&fe>0)opts.push({f:ESH[q].map(x=>x<0?-1:x+fe),fret:fe});
  if(q in ASH&&fa>0)opts.push({f:ASH[q].map(x=>x<0?-1:x+fa),fret:fa});
  if(!opts.length)return null;opts.sort((x,y)=>x.fret-y.fret);return{f:opts[0].f,approx}}
function diagramSVG(f){const fr=f.filter(x=>x>0),mx=Math.max(...fr,1),mn=Math.min(...fr,99);
  const start=mx<=4?1:mn;const W=150,H=150,x0=22,y0=26,dx=(W-2*x0)/5,dy=22;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Схема аккорда">';
  for(let i=0;i<6;i++)s+='<line class="ln" x1="'+(x0+i*dx)+'" y1="'+y0+'" x2="'+(x0+i*dx)+'" y2="'+(y0+5*dy)+'" stroke-width="1"/>';
  for(let j=0;j<=5;j++)s+='<line class="'+(j===0&&start===1?'nut':'ln')+'" x1="'+x0+'" y1="'+(y0+j*dy)+'" x2="'+(x0+5*dx)+'" y2="'+(y0+j*dy)+'" stroke-width="'+(j===0&&start===1?4:1)+'"/>';
  if(start>1)s+='<text class="tx" x="'+(x0+5*dx+6)+'" y="'+(y0+dy*.7)+'">'+start+'</text>';
  // баррэ: минимальный лад на нескольких струнах
  const bar=fr.length?Math.min(...fr):0,barS=f.map((x,i)=>x===bar?i:-1).filter(i=>i>=0);
  if(bar>0&&barS.length>=2&&barS[barS.length-1]-barS[0]>=2&&f.slice(barS[0],barS[barS.length-1]+1).every(x=>x>=bar)){const a=barS[0],b=barS[barS.length-1],y=y0+(bar-start+.5)*dy;
    s+='<rect class="dt" x="'+(x0+a*dx-6)+'" y="'+(y-6)+'" width="'+((b-a)*dx+12)+'" height="12" rx="6"/>'}
  f.forEach((x,i)=>{const cx=x0+i*dx;
    if(x<0)s+='<text class="tx" x="'+(cx-4)+'" y="'+(y0-8)+'">×</text>';
    else if(x===0)s+='<circle cx="'+cx+'" cy="'+(y0-12)+'" r="4" fill="none" class="ln" stroke-width="1.5"/>';
    else s+='<circle class="dt" cx="'+cx+'" cy="'+(y0+(x-start+.5)*dy)+'" r="7"/>'});
  return s+'</svg>'}

const KEEP=/(капо|capo|тональност|бой\b|бой:|перебор|ритм|темп|strum)/i;            // полезные подсказки не трогаем
const TABLINE=/^\s*[eBGDAEbgdae]\s*[|:][-\d|hpbrsx\/\\~()^.\s]{4,}$/;                // табулатура
const FINGER=/^\s*([A-H][#b]?[^\s:=]{0,7}\s*[:=\-–]?\s*\(?[x×\d]{6}\)?\s*)+$/i;      // Am: x02210, C x32010 G 320003
const NOISE=/^\s*[\d\s.,:;/|*★☆♥❤👍👎✓✔•·\-–—_=~^%()+]+\s*$/;                       // числа, звёздочки, счётчики
const ZW=/[​-‏⁠﻿­]/g;
function cleanChords(t){const det={junk:0,tab:0,finger:0,noise:0,head:0,foot:0};
  let L=t.replace(/\r\n?/g,'\n').replace(ZW,'').replace(/ /g,' ').replace(/\t/g,'    ').split('\n').map(l=>l.replace(/\s+$/,''));
  const isMusic=l=>isChordLine(l)||/\[[A-H][^\]]*\]/.test(l)||SECT.test(l)||SECT_INLINE.test(l);
  const first=L.findIndex(isMusic);
  // подвал страницы: всё после «Похожие песни», «Комментарии»…
  if(first>=0){const f=L.findIndex((l,i)=>i>first&&FOOTER.test(l));if(f>0){det.foot=L.slice(f).filter(x=>x.trim()).length;L=L.slice(0,f)}}
  // шапка страницы: строки до первого аккорда или подписи части (кроме полезных подсказок)
  if(first>0){const keep=[];L.slice(0,first).forEach(l=>{if(!l.trim())return;if(KEEP.test(l)&&l.length<80)keep.push(l);else det.head++});L=keep.concat(keep.length?['']:[],L.slice(first))}
  L=L.filter(l=>{if(!l.trim())return true;
    if(isChordLine(l)&&!FINGER.test(l))return true;
    if(TABLINE.test(l)){det.tab++;return false}
    if(FINGER.test(l)){det.finger++;return false}
    if(KEEP.test(l)&&l.length<80)return true;
    if(JUNK.test(l)){det.junk++;return false}
    if(NOISE.test(l)){det.noise++;return false}
    return true});
  const text=L.join('\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'');
  const removed=Object.values(det).reduce((a,b)=>a+b,0);return{text,removed,det}}
function cleanReport(det){const p=[];if(det.head)p.push('шапка '+det.head);if(det.foot)p.push('подвал '+det.foot);if(det.junk)p.push('мусор '+det.junk);
  if(det.tab)p.push('табы '+det.tab);if(det.finger)p.push('аппликатуры '+det.finger);if(det.noise)p.push('цифры/значки '+det.noise);return p.join(', ')}
function smartPaste(ta){ta.addEventListener('paste',e=>{const raw=(e.clipboardData||window.clipboardData)?.getData('text');if(!raw)return;
  e.preventDefault();const prev=ta.value;const {text,removed,det}=cleanChords(raw);const s=ta.selectionStart,en=ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=s+text.length;
  offerUndo(ta,prev.slice(0,s)+raw+prev.slice(en),removed);toast(removed?'Вставил, убрал строк: '+removed+' ('+cleanReport(det)+')':'Вставлено')})}

    offerUndo(ta,prev.trim()?prev.replace(/\s*$/,'\n\n')+raw:raw,removed);toast(removed?'Вставил, убрал строк: '+removed+' ('+cleanReport(det)+')':'Вставлено')}

/* ---------- тюнер ---------- */
const STRINGS=[['E',82.41],['A',110],['D',146.83],['G',196],['B',246.94],['E',329.63]];
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let tun=null;
function acf(buf,sr){let rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/buf.length);if(rms<0.008)return -1;
  let r1=0,r2=buf.length-1;const th=.2;for(let i=0;i<buf.length/2;i++)if(Math.abs(buf[i])<th){r1=i;break}
  for(let i=1;i<buf.length/2;i++)if(Math.abs(buf[buf.length-i])<th){r2=buf.length-i;break}
  const b=buf.slice(r1,r2),n=b.length,c=new Float32Array(n);for(let i=0;i<n;i++)for(let j=0;j<n-i;j++)c[i]+=b[j]*b[j+i];
  let d=0;while(d<n-1&&c[d]>c[d+1])d++;let mx=-1,mp=-1;for(let i=d;i<n;i++)if(c[i]>mx){mx=c[i];mp=i}
  let T0=mp;const x1=c[T0-1],x2=c[T0],x3=c[T0+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;if(a)T0=T0-bb/(2*a);return T0>0?sr/T0:-1}
function openTuner(){openSheet('<div class="shnav gut"><span></span><b>Тюнер</b><button class="r" id="tnDone">Готово</button></div>'+
  '<div class="shbody gut tuner"><div class="tn-note"><span id="tnNote">—</span><small id="tnOct"></small></div><div class="tn-hz" id="tnHz">Сыграй открытую струну</div>'+
  '<div class="tn-lvl"><i id="tnLvl"></i></div><div class="tn-meter"><div class="tn-zero"></div><div class="tn-needle" id="tnNeedle"></div></div><div class="tn-scale"><span>−50</span><span>0</span><span>+50</span></div>'+
  '<div class="tn-strings" id="tnStr">'+STRINGS.map((s,i)=>'<span data-i="'+i+'">'+s[0]+'</span>').join('')+'</div>'+
  '<button class="pill primary" id="tnStart">Включить микрофон</button><p class="note" id="tnMsg">Стандартный строй: E A D G B E. Держи телефон рядом с гитарой.</p></div>',{onClose:stopTuner});
  $('tnDone').onclick=closeSheet;$('tnStart').onclick=startTuner}
async function startTuner(){const AC=window.AudioContext||window.webkitAudioContext;let ctx=null;
  try{ctx=new AC();ctx.resume()}catch(e){}            // создаём и «будим» звук прямо в нажатии — иначе iPhone держит его на паузе
  $('tnStart').textContent='Включаю микрофон…';$('tnStart').disabled=true;
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){$('tnStart').hidden=true;$('tnMsg').textContent='Нет доступа к микрофону. Разреши: Настройки → Safari → Микрофон → «Разрешить», затем открой тюнер снова.';return}
  if(!ctx)ctx=new AC();if(ctx.state!=='running'){try{await ctx.resume()}catch(e){}}
  const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=4096;src.connect(an);
  const N=an.fftSize,buf=new Float32Array(N),sr=ctx.sampleRate;tun={stream,ctx,raf:0,hist:[],frame:0,heard:0,t0:performance.now()};
  $('tnStart').hidden=true;$('tnMsg').textContent='Сыграй открытую струну и дай ей прозвучать.';
  const minLag=Math.floor(sr/1000),maxLag=Math.min(Math.floor(sr/65),(N>>1)-2),W=N-maxLag,d=new Float32Array(maxLag+2);
  const detect=()=>{let rms=0;for(let i=0;i<N;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/N);$('tnLvl').style.width=Math.min(100,rms*900)+'%';
    if(rms<0.002)return -1;tun.heard++;
    // YIN: разностная функция с нормировкой
    d[0]=1;let run=0;for(let tau=1;tau<=maxLag;tau++){let s=0;for(let i=0;i<W;i+=2){const x=buf[i]-buf[i+tau];s+=x*x}run+=s;d[tau]=run?s*tau/run:1}
    let tau=-1;for(let k=minLag;k<maxLag;k++){if(d[k]<0.15){while(k+1<maxLag&&d[k+1]<d[k])k++;tau=k;break}}
    if(tau<0)return -1;const a=d[tau-1],b=d[tau],c=d[tau+1],den=a+c-2*b;const tt=den?tau+(a-c)/(2*den):tau;return sr/tt};
  const loop=()=>{if(!tun)return;tun.raf=requestAnimationFrame(loop);if(tun.frame++%2)return;
    if(ctx.state!=='running'){$('tnMsg').innerHTML='Звук на паузе. <button class="pill" id="tnWake" style="height:34px;margin-top:6px">Включить</button>';const w=$('tnWake');if(w)w.onclick=()=>ctx.resume();return}
    an.getFloatTimeDomainData(buf);const f=detect();
    if(!tun.heard&&performance.now()-tun.t0>4000)$('tnMsg').textContent='Микрофон молчит. Проверь, что тюнеру разрешён микрофон, и поднеси телефон к гитаре.';
    if(f>60&&f<1100){tun.hist.push(f);if(tun.hist.length>5)tun.hist.shift();const fs=[...tun.hist].sort((x,y)=>x-y)[tun.hist.length>>1];
      const n=12*Math.log2(fs/440)+69,r=Math.round(n),cents=Math.round((n-r)*100);
      $('tnNote').textContent=NN[(r%12+12)%12];$('tnOct').textContent=Math.floor(r/12)-1;$('tnHz').textContent=fs.toFixed(1)+' Гц · '+(cents>0?'+':'')+cents+' центов';
      const nd=$('tnNeedle');nd.style.left=(50+Math.max(-50,Math.min(50,cents)))+'%';nd.classList.toggle('ok',Math.abs(cents)<=5);
      $('tnMsg').textContent=Math.abs(cents)<=5?'Чисто ✓':cents<0?'Ниже — подтяни струну':'Выше — ослабь струну';
      let bi=0,bd=1e9;STRINGS.forEach((s,i)=>{const dd=Math.abs(12*Math.log2(fs/s[1]));if(dd<bd){bd=dd;bi=i}});
      $('tnStr').querySelectorAll('span').forEach((e,i)=>e.classList.toggle('on',i===bi&&bd<2.5))}};
  loop()}
function stopTuner(){if(!tun)return;cancelAnimationFrame(tun.raf);tun.stream.getTracks().forEach(t=>t.stop());try{tun.ctx.close()}catch(e){}tun=null}

let unlockAudio=null;
function startMet(){const k=idOf(cur),{p,bpm}=grooveOf(k);if(!p)return;
  const AC=window.AudioContext||window.webkitAudioContext;const ctx=new AC();ctx.resume();
  try{if(!unlockAudio){unlockAudio=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');unlockAudio.loop=true}unlockAudio.play().catch(()=>{})}catch(e){}
  const slots=p.length,beats=slots/2,spb=60/bpm;let next=ctx.currentTime+.08,beat=0;
  const click=(t,acc)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=acc?1500:1000;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(acc?.6:.35,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.07)};
  const t0=next;
  met={ctx,timer:setInterval(()=>{while(next<ctx.currentTime+.12){click(next,beat%beats===0);next+=spb;beat++}},25),raf:0};
  const draw=()=>{if(!met)return;const el=$('gvPat');if(el){const pos=(ctx.currentTime-t0)/(spb/2);const i=pos<0?-1:Math.floor(pos)%slots;
      el.querySelectorAll('span').forEach((s,j)=>s.classList.toggle('now',j===i))}met.raf=requestAnimationFrame(draw)};draw();renderGroove()}

function startVoice(){if(!SR){toast('Этот браузер не умеет распознавать речь');return}
  const r=new SR();r.lang='ru-RU';r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
  voice={r,last:0,lastText:''};
  r.onresult=e=>{if(!voice)return;const now=Date.now();if(now-voice.last<1500)return;
    for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];
      for(let a=0;a<res.length;a++){const txt=res[a].transcript.toLowerCase().trim();if(!txt||txt===voice.lastText)continue;
        const words=txt.split(/\s+/).slice(-3).join(' ');      // смотрим только последние слова — песня рядом может «наговорить» лишнего
        for(const [re,fn] of VCMD){if(re.test(words)){const said=fn();if(said){voice.last=now;voice.lastText=txt;toast('🎙 '+said)}return}}}}};
  r.onerror=e=>{if(!voice)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopVoice();toast('Разреши микрофон и распознавание речи в настройках');}};
  r.onend=()=>{if(voice&&voice.r===r){try{r.start()}catch(e){}}};   // iPhone сам останавливает распознавание — перезапускаем
  try{r.start();toast('Слушаю: «дальше», «назад», «стоп», «поехали», «вниз», «вверх»')}catch(e){voice=null;toast('Не получилось включить микрофон')}

  return{all:async k=>{const db=await open();return new Promise(res=>{const out=[];db.transaction('takes').objectStore('takes').openCursor().onsuccess=e=>{const c=e.target.result;if(c){if(c.value.k===k)out.push(c.value);c.continue()}else res(out.sort((a,b)=>b.t-a.t))}})},

  $('rcDone').onclick=closeSheet;$('rcBtn').onclick=()=>rec?stopRec():startRec(k);drawTakes(k)}
async function drawTakes(k){let list=[];try{list=await recDB.all(k)}catch(e){}const L=$('rcList');if(!L)return;
  L.innerHTML=list.length?list.map(x=>'<div class="take"><span>'+new Date(x.t).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+Math.round(x.dur)+' с</span><audio controls preload="metadata" src="'+URL.createObjectURL(x.blob)+'"></audio><button class="pb x" data-del="'+x.id+'" aria-label="Удалить запись">✕</button></div>').join(''):'<div class="empty" style="padding:20px">Записей пока нет</div>';

  const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(stream,type?{mimeType:type}:undefined),chunks=[];mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};

    try{await recDB.put({id:'r'+Date.now(),k,t:Date.now(),dur,blob});const all=await recDB.all(k);for(const x of all.slice(5))await recDB.del(x.id)}catch(e){toast('Не удалось сохранить запись')}

  const buf=new Float32Array(1024);
  const tick=()=>{if(!rec)return;const s=(performance.now()-t0)/1000;$('rcTime').textContent='0:'+String(Math.min(30,Math.floor(s))).padStart(2,'0')+' / 0:30';

function buildEvening(dur,src,mix){const need=Math.max(3,Math.round(dur/3.5));
  const pool=poolOf(src).map(s=>({s,k:idOf(s),last:st.played[idOf(s)]||'0000',r:Math.random()})).sort((a,b)=>a.last<b.last?-1:a.last>b.last?1:a.r-b.r).slice(0,need);
  let list=pool.map(x=>x.k);
  if(mix){const fast=[],slow=[];list.forEach(k=>{const b=st.bpm[k];(b?b>=100:Math.random()<.5)?fast.push(k):slow.push(k)});
    list=[];while(fast.length||slow.length){if(slow.length)list.push(slow.shift());if(fast.length)list.push(fast.shift())}}
  else list.sort(()=>Math.random()-.5);
  return list}

const syncOn=()=>!!(sync&&sync.url&&sync.pw);
async function api(method,body){const r=await fetch(sync.url.replace(/\/+$/,'')+'/api/'+encodeURIComponent(sync.user),
  {method,headers:{'Authorization':'Bearer '+sync.pw,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  let j={};try{j=await r.json()}catch(e){}return{status:r.status,j}}
function applyRemote(d,updated){st=Object.assign({fav:{},chords:{},tr:{},capo:{},simp:{},simpPrev:{},strum:{},bpm:{},learn:{},notes:{},hard:{},played:{},pc:{},custom:[],pl:[],order:[],hist:[],fs:16},d);st.updated=updated;
  ['fav','chords','tr','capo','simp','simpPrev','strum','bpm','learn','notes','hard','played','pc'].forEach(k=>{if(!st[k]||typeof st[k]!=='object')st[k]={}});if(!Array.isArray(st.custom))st.custom=[];if(!Array.isArray(st.order))st.order=[];if(!Array.isArray(st.pl))st.pl=[];if(!Array.isArray(st.hist))st.hist=[];
  syncOrder();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}ALL=allSongs();renderHome();if(cur){const c=ALL.find(x=>idOf(x)===idOf(cur));if(c){cur=c;renderView();starSync();renderNext()}}}
function mark(ok,msg){syncState={ok,at:Date.now(),msg:msg||''}}
async function pull(){if(!syncOn()||pulling)return;pulling=true;
  try{const {status,j}=await api('GET');
    if(status===401){mark(false,'Неверный пароль');return}
    if(status!==200){mark(false,'Сервер ответил '+status);return}
    const lu=st.updated||0;
    if(j.data&&j.updated>lu){applyRemote(j.data,j.updated);mark(true)}
    else if(!j.data||j.updated<lu){await push(true)}
    else mark(true)}
  catch(e){mark(false,'Нет связи с сервером')}finally{pulling=false;if(syncState.ok)checkInbox()}}
async function push(now){if(!syncOn())return;clearTimeout(pushT);
  if(!now){pushT=setTimeout(()=>push(true),1500);return}
  try{const {status,j}=await api('PUT',{data:st,updated:st.updated||Date.now()});
    if(status===200)mark(true);else if(status===409&&j.data){applyRemote(j.data,j.updated);mark(true);toast('Подтянул новые данные с сервера')}
    else mark(false,status===401?'Неверный пароль':'Сервер ответил '+status)}
  catch(e){mark(false,'Нет связи — сохраню, когда появится интернет')}}
addEventListener('online',()=>pull());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
function syncLabel(){if(!syncOn())return 'Синхронизация · выкл';if(syncState.ok===false)return 'Синхронизация · ошибка';
  if(syncState.ok)return 'Синхронизация · ✓ '+new Date(syncState.at).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});return 'Синхронизация · подключено'}
function openSync(){const s=sync||{url:SYNC_URL,user:SYNC_USER,pw:''};
  openSheet('<div class="shnav gut"><button class="l" id="syClose">Закрыть</button><b>Синхронизация</b><span></span></div>'+
  '<div class="shbody gut"><p class="note">Звёздочки, твои аккорды и добавленные песни сохраняются на твоём сервере и появляются на любом устройстве. Удаление иконки больше ничего не сотрёт.</p>'+
  '<div class="form"><input id="syUrl" placeholder="Адрес сервера" autocapitalize="off" autocomplete="off" inputmode="url"><input id="syUser" placeholder="Имя" autocapitalize="off" autocomplete="username"><input id="syPw" type="password" placeholder="Пароль" autocomplete="current-password"></div>'+
  '<p class="note" id="syStat"></p><button class="pill primary" id="syGo">'+(syncOn()?'Сохранить и проверить':'Подключить')+'</button>'+(syncOn()?'<button class="pill" id="syOff">Отключить на этом устройстве</button>':'')+'</div>');
  $('syUrl').value=s.url||SYNC_URL;$('syUser').value=s.user||SYNC_USER;$('syPw').value=s.pw||'';
  const stat=$('syStat');stat.textContent=syncOn()?(syncState.ok===false?'⚠︎ '+syncState.msg:syncState.ok?'✓ Всё сохранено':''):'';
  $('syClose').onclick=closeSheet;
  if($('syOff'))$('syOff').onclick=()=>{sync=null;ls.set('sync','null');closeSheet();toast('Синхронизация выключена')};
  $('syGo').onclick=async()=>{let url=$('syUrl').value.trim();if(url&&!/^https?:\/\//.test(url))url='https://'+url;
    const prev=sync;sync={url,user:$('syUser').value.trim().toLowerCase(),pw:$('syPw').value.trim()};
    if(!sync.url||!sync.user||!sync.pw){stat.textContent='Заполни адрес, имя и пароль';sync=prev;return}
    stat.textContent='Проверяю…';
    let res;try{res=await api('GET');
      if(res.status===401){stat.textContent='⚠︎ Неверное имя или пароль';sync=prev;return}
      if(res.status!==200){stat.textContent='⚠︎ Сервер ответил '+res.status;sync=prev;return}}
    catch(e){stat.textContent='⚠︎ Не могу достучаться до сервера. Проверь адрес.';sync=prev;return}
    ls.set('sync',JSON.stringify(sync));
    // при подключении устройства данные с сервера главнее; пустой сервер получает данные этого телефона
    if(!prev&&res.j.data){applyRemote(res.j.data,res.j.updated);mark(true);closeSheet();toast('Данные загружены с сервера');checkInbox();return}
    if(!res.j.data){st.updated=st.updated||Date.now();await push(true)}else await pull();
    closeSheet();toast('Синхронизация включена');checkInbox()}}

document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('sheet').hidden)closeSheet();else if($('dia').classList.contains('on'))hideDia();else if(cur)closeSong()});

renderHome();
(()=>{let o=null;try{o=JSON.parse(ls.get('open','null'))}catch(e){}
  if(!o||Date.now()-o.t>6*3600e3)return;const s=byKey(o.k);if(!s)return;
  if(o.tab&&o.tab!==tab){tab=o.tab;ls.set('tab',tab)}curPl=o.pl||null;renderHome();
  const ctx=(o.ctx||[]).map(byKey).filter(Boolean);lastItems=ctx.length?ctx:[s];
  const p=$('song');p.style.transition='none';openSong(s);requestAnimationFrame(()=>p.style.transition='')})();
pull();
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let done=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;if(typeof cur!=='undefined'&&cur){window.__updReady=true}else location.reload()}});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{})}
</script>
